<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Server Access Map</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --panel2: #20262f; --border: #2c333d;
    --text: #e6e9ee; --muted: #9aa4b2; --accent: #4da3ff; --warn: #ffb454; --bad: #ff5d5d;
    --good: #57d38c;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; background:var(--panel); flex-shrink:0; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .quickfilters { margin-left:auto; display:flex; gap:8px; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px 10px; cursor:pointer; font-size:12px; }
  button:hover { background:#28303b; }
  button.warnbtn { border-color:var(--warn); color:var(--warn); }
  button.badbtn { border-color:var(--bad); color:var(--bad); }
  #main { flex:1; display:flex; min-height:0; }
  #sidebar { width:320px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--panel); }
  #sidebar .tabs { display:flex; border-bottom:1px solid var(--border); }
  #sidebar .tabs button { flex:1; border:none; border-radius:0; background:transparent; padding:10px; }
  #sidebar .tabs button.active { background:var(--panel2); border-bottom:2px solid var(--accent); }
  .searchRow { display:flex; gap:6px; margin:10px; align-items:stretch; }
  #searchBox { flex:1; min-width:0; padding:8px; border-radius:4px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  #sortDirBtn { flex-shrink:0; font-size:12px; padding:6px 10px; }
  #listPanel { flex:1; overflow-y:auto; padding:0 6px 10px; }
  .listItem { padding:8px 10px; border-radius:4px; cursor:pointer; font-size:13px; margin-bottom:2px; }
  .listItem:hover { background:var(--panel2); }
  .listItem .sub { color:var(--muted); font-size:11px; }
  .badge { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; margin-left:6px; vertical-align:middle; }
  .badge.disabled { background:var(--bad); color:#fff; }
  .badge.dormant { background:var(--warn); color:#000; }
  .badge.locked { background:var(--bad); color:#fff; }
  .badge.broken { background:var(--warn); color:#000; }
  .listMore { padding:8px 10px; color:var(--muted); font-size:11px; font-style:italic; }
  #content { flex:1; overflow-y:auto; padding:16px; min-width:0; }
  #welcome { color:var(--muted); max-width:600px; }
  #welcome ul { line-height:1.8; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:14px 16px; margin-bottom:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .breadcrumb { font-size:15px; font-weight:600; line-height:1.7; word-break:break-word; margin-bottom:6px; }
  .crumbLink { color:var(--accent); cursor:pointer; }
  .crumbLink:hover { text-decoration:underline; }
  .crumbCurrent { color:var(--text); }
  .crumbPlain { color:var(--muted); font-weight:400; }
  .crumbSep { color:var(--muted); margin:0 5px; font-weight:400; }
  .card .field { display:inline-block; min-width:220px; margin:2px 18px 2px 0; font-size:13px; }
  .card .field b { color:var(--muted); font-weight:500; }
  .treeWrap { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px; margin-bottom:16px; }
  .treeToolbar { display:flex; align-items:center; gap:14px; padding:2px 6px 8px; flex-wrap:wrap; border-bottom:1px solid var(--border); margin-bottom:6px; }
  .treeToolbar .groupLabel { font-size:11px; color:var(--muted); margin-right:2px; }
  .depthBtn { padding:4px 9px; font-size:11px; }
  .depthBtn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .treeNote { font-size:11px; color:var(--muted); padding:4px 8px; }
  .treeHost { max-height:520px; overflow-y:auto; padding:4px 6px; }
  .treeNode { }
  .treeRow { display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:4px; cursor:pointer; font-size:13px; }
  .treeRow:hover { background:var(--panel2); }
  .treeRow.selected { background:#20304a; outline:1px solid var(--accent); }
  .treeToggle { display:inline-block; width:14px; text-align:center; color:var(--muted); flex-shrink:0; }
  .treeToggle.hasChildren { cursor:pointer; }
  .treeToggle.hasChildren:hover { color:var(--text); }
  .treeLabel { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .treeCount { font-size:10px; color:var(--muted); background:var(--panel2); border-radius:8px; padding:1px 7px; flex-shrink:0; }
  .treeChildren { margin-left:20px; padding-left:10px; border-left:1px solid var(--border); }
  .treeMore { font-size:11px; color:var(--muted); font-style:italic; padding:3px 6px 3px 26px; }
  .detailTabs { display:flex; gap:4px; margin-bottom:8px; }
  .detailTabBtn { padding:6px 14px; font-size:12px; }
  .detailTabBtn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .graphWrap { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px; margin-bottom:16px; position:relative; }
  .graphToolbar { display:flex; align-items:center; gap:14px; padding:2px 6px 8px; flex-wrap:wrap; }
  .graphToolbar .groupLabel { font-size:11px; color:var(--muted); margin-right:2px; }
  .graphLegendToggle { position:absolute; right:14px; bottom:14px; width:26px; height:26px; border-radius:50%; background:var(--panel2); border:1px solid var(--border); color:var(--muted); font-size:14px; font-weight:600; font-style:italic; font-family:Georgia,serif; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; }
  .graphLegendToggle:hover { color:var(--text); border-color:var(--muted); }
  .graphLegendPanel { position:absolute; right:14px; bottom:48px; width:230px; background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:12px 14px; font-size:11px; z-index:5; box-shadow:0 4px 16px rgba(0,0,0,0.4); }
  .graphLegendPanel h4 { margin:0 0 6px; font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
  .graphLegendPanel h4:not(:first-child) { margin-top:10px; }
  .graphLegendRow { display:flex; align-items:center; gap:7px; padding:2px 0; }
  .graphLegendSwatch { width:13px; height:13px; border-radius:3px; flex-shrink:0; }
  .graphLegendLine { width:16px; height:0; border-top:3px solid; flex-shrink:0; }
  .graphLegendLine.dashed { border-top-style:dashed; }
  .graphLegendDot { width:9px; height:9px; border-radius:50%; background:#ffb454; border:1px solid #000; flex-shrink:0; }
  .zoomBtn { padding:4px 9px; font-size:13px; line-height:1; }
  .graphNote { font-size:11px; color:var(--muted); padding:4px 8px; }
  svg.graph { width:100%; height:520px; display:block; background:#15191f; border-radius:4px; touch-action:none; }
  svg.graph text { fill:var(--text); font-size:11px; font-family:inherit; pointer-events:none; }
  svg.graph .nodeGroup { cursor:grab; }
  svg.graph .nodeGroup:active { cursor:grabbing; }
  svg.graph .nodeCircle { stroke:#000; stroke-width:1; }
  svg.graph .centerCircle { fill:#ffb454; }
  svg.graph .nodeLabel { font-weight:500; }
  svg.graph .nodeSubLabel { fill:var(--muted); font-size:9px; }
  svg.graph .edgeLabel { fill:var(--muted); font-size:9px; }
  svg.graph .flagRing { pointer-events:none; }
  .summaryGrid { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap:14px; margin-bottom:18px; }
  .statCard { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:14px 16px; }
  .statCard .bigNum { font-size:28px; font-weight:600; line-height:1; }
  .statCard .cardLabel { font-size:12px; color:var(--muted); margin-top:6px; }
  .statCard.clickable { cursor:pointer; }
  .statCard.clickable:hover { background:var(--panel2); }
  .statCard.warn .bigNum { color:var(--warn); }
  .statCard.bad .bigNum { color:var(--bad); }
  .breakdownRow { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid #22272e; }
  .breakdownRow:last-child { border-bottom:none; }
  .summarySection { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:16px; }
  .summarySection h2 { font-size:14px; margin:0 0 12px; }
  .chartRow { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  .chartLegend { font-size:12px; }
  .chartLegend .legendRow { display:flex; align-items:center; gap:8px; padding:3px 0; }
  .legendSwatch { width:11px; height:11px; border-radius:2px; flex-shrink:0; }
  .disclaimerBanner { background:#2a2410; border:1px solid var(--warn); color:var(--warn); border-radius:6px; padding:10px 14px; font-size:12px; margin-bottom:16px; }
  .incompleteBanner { background:#3a1a1a; border:1px solid var(--bad); color:#ff9d9d; border-radius:6px; padding:12px 16px; font-size:13px; margin-bottom:18px; font-weight:500; }
  .headerIncompleteBadge { background:var(--bad); color:#fff; font-size:11px; font-weight:600; padding:3px 9px; border-radius:10px; margin-left:6px; }
  .obsCard { border-left:3px solid var(--warn); background:var(--panel2); border-radius:0 6px 6px 0; padding:10px 14px; margin-bottom:10px; }
  .obsCard .obsTitle { font-weight:600; font-size:13px; margin-bottom:4px; }
  .obsCard .obsWhy { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .obsCard .obsFrameworks { font-size:11px; color:var(--text); }
  .guidanceRow { display:flex; align-items:flex-start; gap:8px; margin-bottom:5px; }
  .regionPill { flex-shrink:0; width:34px; text-align:center; font-size:10px; font-weight:600; padding:1px 0; border-radius:3px; }
  .regionPill-AU { background:#003a5c; color:#7dd3fc; }
  .regionPill-NZ { background:#1a2e1a; color:#86efac; }
  .regionPill-US { background:#2e1a3a; color:#d8b4fe; }
  .regionPill-Intl { background:#2c333d; color:var(--muted); }
  .abuseTable { width:100%; border-collapse:collapse; font-size:12px; }
  .abuseTable th, .abuseTable td { text-align:left; padding:5px 8px; border-bottom:1px solid #22272e; vertical-align:top; }
  .abuseTable th { color:var(--muted); font-weight:500; }
  .scanErrorsTable { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .scanErrorsTable th, .scanErrorsTable td { text-align:left; padding:5px 8px; border-bottom:1px solid #22272e; }
  .scanErrorsTable th { color:var(--muted); font-weight:500; }
  table.datatable { width:100%; border-collapse:collapse; font-size:12px; }
  table.datatable th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); cursor:pointer; color:var(--muted); position:sticky; top:0; background:var(--panel); user-select:none; }
  table.datatable th:hover { color:var(--text); }
  table.datatable td { padding:5px 8px; border-bottom:1px solid #22272e; }
  table.datatable tr.rowclick { cursor:pointer; }
  table.datatable tr.rowclick:hover td { background:var(--panel2); }
  .tableToolbar { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .tableToolbar input { flex:1; padding:6px; border-radius:4px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  .pill { padding:2px 6px; border-radius:3px; font-size:10px; }
  .pill.inherited { background:#2c333d; color:var(--muted); }
  .pill.explicit { background:#2c4a3d; color:var(--good); }
  .pill.deny { background:var(--bad); color:#fff; }
  #backBtn:disabled { opacity:0.4; cursor:default; }
  footer { padding:6px 16px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); flex-shrink:0; }

  /* Resizable / responsive split panes */
  #splitter { width:6px; flex-shrink:0; cursor:col-resize; background:var(--border); touch-action:none; }
  #splitter:hover, #splitter.dragging { background:var(--accent); }
  @media (max-width: 760px) {
    #main { flex-direction:column; }
    #sidebar { width:100% !important; height:38vh; flex-shrink:0; border-right:none; border-bottom:1px solid var(--border); }
    #splitter { display:none; }
    #content { height:auto; }
  }

  /* Tri-state quick filter buttons: off (neutral outline) / show-only (green) / hide (red) */
  button.filterbtn.state-show { background:var(--good); color:#062b17; border-color:var(--good); font-weight:600; }
  button.filterbtn.state-hide { background:var(--bad); color:#fff; border-color:var(--bad); font-weight:600; }
  .filterStateLabel { font-size:9px; text-transform:uppercase; letter-spacing:0.03em; opacity:0.85; margin-left:5px; }

  /* Folder tree: "virtual" nodes stand in for a path segment the scan itself
     never recorded as its own folder (so parent/child structure still nests
     correctly even when the scan has gaps) -- shown distinctly since there's
     no data behind them to open. */
  .treeRow.virtual .treeLabel { color:var(--muted); font-style:italic; }
  .treeRow.virtual { cursor:default; }
  .treeRow.virtual:hover { background:none; }
  .virtualNote { font-size:9px; color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:0 6px; flex-shrink:0; }

  /* Nested ACL list (a folder's identities, with group members collapsible
     underneath the group instead of flattened alongside it) */
  .aclWrap { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:16px; }
  .aclSummary { font-size:12px; color:var(--muted); padding:0 4px 8px; }
  .aclToolbar { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .aclToolbar input { flex:1; padding:6px; border-radius:4px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  .aclHost { max-height:520px; overflow-y:auto; }
  .aclRow { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:4px; cursor:pointer; font-size:13px; }
  .aclRow:hover { background:var(--panel2); }
  .aclRow .treeToggle { display:inline-block; width:14px; text-align:center; color:var(--muted); flex-shrink:0; }
  .aclRow .treeToggle.hasChildren { cursor:pointer; }
  .aclRow .treeToggle.hasChildren:hover { color:var(--text); }
  .aclName { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .aclType { font-size:10px; color:var(--muted); flex-shrink:0; }
  .aclChildren { margin-left:20px; padding-left:10px; border-left:1px solid var(--border); }
  .aclChildren .aclRow { font-size:12px; }
  .aclViaNote { font-size:10px; color:var(--muted); flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>File Server Access Map</h1>
    <button id="summaryBtn">Summary</button>
    <span id="headerIncompleteBadge" style="display:none;" class="headerIncompleteBadge" title="Click Summary for details">Incomplete data</span>
    <button id="backBtn" disabled>&larr; Back</button>
    <div class="quickfilters">
      <button id="btnBroken" class="filterbtn warnbtn">Broken inheritance folders</button>
      <button id="btnDormant" class="filterbtn badbtn">Disabled / dormant identities</button>
    </div>
  </header>
  <div id="main">
    <div id="sidebar">
      <div class="tabs">
        <button id="tabIdentities" class="active">Identities</button>
        <button id="tabFolders">Folders</button>
      </div>
      <div class="searchRow">
        <input id="searchBox" type="text" placeholder="Search...">
        <button id="sortDirBtn" title="Sort direction">A&ndash;Z</button>
      </div>
      <div id="listPanel"></div>
    </div>
    <div id="splitter" title="Drag to resize"></div>
    <div id="content">
      <div id="welcome"></div>
    </div>
  </div>
  <footer id="footerLine"></footer>
</div>

<script src="AccessMap_data/manifest.js"></script>
<script>
'use strict';

/* ---------------------------------------------------------------------------
   Data loading.

   Build-AccessMapHtml.ps1 copies THIS FILE byte-for-byte to AccessMap.html --
   nothing on this page is templated or rewritten at generation time. Every
   run's actual data lives next to it in a sibling AccessMap_data/ folder:

     AccessMap.html
     AccessMap_data/
       manifest.js     -- identities, folders, and every dashboard-level
                           total/observation, loaded eagerly (small
                           regardless of audit size: one entry per identity
                           and per folder, never per access grant)
       share_0.js       -- one file per top-level share (\\server\share),
       share_1.js ...       each holding just that share's access edges
                             (folder x identity ACE rows -- the part of the
                             dataset that actually gets huge)

   manifest.js is loaded up front via the <script src> above -- <script src>
   works from file:// with no CORS restrictions and no server, unlike
   fetch()/XHR, so this stays a "just open it" report. A share_N.js file is
   only fetched the moment something on screen actually needs that share's
   access entries (a folder is selected, an identity with access there is
   selected, or the relationship graph expands into it) -- see
   ensureShareLoaded() below. This is what lets a multi-gigabyte audit open
   instantly instead of parsing the whole thing before showing anything.
--------------------------------------------------------------------------- */
const ACCESS_MAP_DATA_DIR = 'AccessMap_data';
const MAX_EDGES_PER_NODE = ACCESS_MAP_MANIFEST.maxEdgesPerNode;

// DATA mirrors the old all-in-one shape everything below was written
// against. identities/folders and the rest are eager (straight off the
// manifest); edges starts EMPTY and grows in place as share chunks load
// (see mergeEdges) -- every place below that reads DATA.edges/byFolder/
// byIdentity/adjacency for a specific folder or identity is only ever
// reached after that folder's/identity's own share(s) are confirmed loaded.
const DATA = {
  identities: ACCESS_MAP_MANIFEST.identities,
  folders: ACCESS_MAP_MANIFEST.folders,
  edges: [],
  generatedAt: ACCESS_MAP_MANIFEST.generatedAt,
  sourceFolder: ACCESS_MAP_MANIFEST.sourceFolder,
  toolkitVersion: ACCESS_MAP_MANIFEST.toolkitVersion,
  scanErrors: ACCESS_MAP_MANIFEST.scanErrors,
  scanComplete: ACCESS_MAP_MANIFEST.scanComplete,
  truncatedRowsDropped: ACCESS_MAP_MANIFEST.truncatedRowsDropped
};

/* ------------------------------ Lazy share data ---------------------------- */

const shareByKey = new Map();
(ACCESS_MAP_MANIFEST.shares || []).forEach(s => shareByKey.set(s.key, s));

const loadedShares = new Set();      // share keys whose edges are in DATA.edges/byFolder/byIdentity/adjacency
const shareLoadPromises = new Map(); // share key -> { promise, resolve, reject } while a chunk is in flight

// Called by each share_N.js chunk file itself, as the very last thing it
// does, once the <script> tag for it has finished loading.
function registerShareChunk(shareKey, edgeRows) {
  if (loadedShares.has(shareKey)) return; // safety net, shouldn't normally happen
  loadedShares.add(shareKey);
  mergeEdges(edgeRows);
  const pending = shareLoadPromises.get(shareKey);
  if (pending) pending.resolve();
}

function ensureShareLoaded(shareKey) {
  if (!shareKey || loadedShares.has(shareKey)) return Promise.resolve();
  const existing = shareLoadPromises.get(shareKey);
  if (existing) return existing.promise;
  const shareMeta = shareByKey.get(shareKey);
  if (!shareMeta) return Promise.resolve(); // unknown key -- nothing to load

  let resolveFn, rejectFn;
  const promise = new Promise((res, rej) => { resolveFn = res; rejectFn = rej; });
  shareLoadPromises.set(shareKey, { promise, resolve: resolveFn, reject: rejectFn });

  const script = document.createElement('script');
  script.src = ACCESS_MAP_DATA_DIR + '/' + shareMeta.file;
  script.onerror = () => {
    shareLoadPromises.delete(shareKey);
    rejectFn(new Error(`Couldn't load ${script.src} -- the AccessMap_data folder may have been moved, renamed, or not copied along with this HTML file.`));
  };
  document.head.appendChild(script);
  return promise;
}

function ensureSharesLoaded(shareKeys) {
  return Promise.all(Array.from(new Set((shareKeys || []).filter(Boolean))).map(ensureShareLoaded));
}

function linkAdjacency(k1, k2, edgeDescr) {
  if (!adjacency.has(k1)) adjacency.set(k1, new Map());
  if (!adjacency.has(k2)) adjacency.set(k2, new Map());
  const m1 = adjacency.get(k1), m2 = adjacency.get(k2);
  if (!m1.has(k2)) m1.set(k2, { edges: [] });
  if (!m2.has(k1)) m2.set(k1, { edges: [] });
  m1.get(k2).edges.push(edgeDescr);
  m2.get(k1).edges.push(edgeDescr);
}

function mergeEdges(edgeRows) {
  edgeRows.forEach(e => {
    const ei = DATA.edges.length;
    DATA.edges.push(e);
    const folderIdx = e[0], identityIdx = e[1];
    if (!byIdentity.has(identityIdx)) byIdentity.set(identityIdx, []);
    byIdentity.get(identityIdx).push(ei);
    if (!byFolder.has(folderIdx)) byFolder.set(folderIdx, []);
    byFolder.get(folderIdx).push(ei);
    linkAdjacency('f:' + folderIdx, 'i:' + identityIdx, { type: 'access', e, ei });
    // Group-membership adjacency ("who else is a member of this group") is
    // NOT built here -- it's global and cheap, so it's built once, eagerly,
    // in precompute() from manifest data, and never depends on which
    // share's access edges happen to be loaded.
  });
}

const RIGHTS_LABELS = ['Full Control', 'Modify', 'Read & Execute', 'Read', 'Write', 'Special'];
// Higher = more "interesting" to show first when a node has more neighbors
// than MAX_EDGES_PER_NODE. Explicit (non-inherited) always outweighs rights level.
const RIGHTS_WEIGHT = [100, 90, 50, 10, 60, 85];
const EDGE_COLORS   = ['#ff5d5d', '#ffb454', '#57d3d3', '#7d8a99', '#4da3ff', '#c084fc'];

const TYPE_COLORS = {
  User: '#4da3ff', Group: '#c084fc', Computer: '#7d8a99',
  'Well-known / Local': '#5a6472', Unresolved: '#5a6472'
};

const DORMANT_DAYS = 90;
const TREE_CHILD_CAP = MAX_EDGES_PER_NODE; // max children shown per folder before "+N more"
const TREE_AUTO_EXPAND_CAP = 1500;         // safety cap on total nodes auto-expanded (Full depth), regardless of tree size

let state = {
  tab: 'identities',
  search: '',
  selected: null,      // { kind: 'identity'|'folder', idx: N }
  history: [],
  tableSort: { col: null, dir: 1 },
  tableFilter: '',
  depth: 1,            // tree auto-expand depth: 1/2/3/4/5/Infinity ("Full") -- 1 = just the
                        // folder itself, no subfolders shown yet; 2 = + its direct subfolders;
                        // 3 = + their own subfolders in turn; etc. Each subfolder's own children
                        // branch from it specifically -- never pooled with a sibling's.
  detailTab: 'tree',   // 'tree' (folder/subfolder hierarchy) or 'graph' (relationship picture)
  graphDepth: 1,       // Graph tab's own depth setting: 1/2/3/4/5/Infinity ("Full") -- 1 = direct
                        // relationships only. Separate from the Tree's `depth` since they mean
                        // different things (relationship hops here vs. subfolder nesting there).
  filterBroken: 0,     // sidebar quick filter, tri-state: 0=off, 1=show only, 2=hide
  filterDormant: 0,    // same, for the disabled/dormant/locked identities filter
  sortDir: 1           // sidebar list sort direction: 1 = A-Z, -1 = Z-A
};

// Case-insensitive comparator for anything shown alphabetically (sidebar
// lists, tree children) -- plain localeCompare()'s default collation isn't
// guaranteed case-insensitive across environments/locales, which could
// otherwise interleave "Arthur"/"bill"/"Diane" in a way that LOOKS unsorted
// even though a comparator was technically applied.
function cmpText(a, b) {
  a = (a || '').toLowerCase();
  b = (b || '').toLowerCase();
  if (a < b) return -1;
  if (a > b) return 1;
  return 0;
}

const RING_SPACING = 130;
const HUB_DEGREE_THRESHOLD = 15;
const GRAPH_NODE_CAP = 600; // safety cap on total nodes drawn in the graph, regardless of depth
let adjacency = new Map(); // 'f:N'|'i:N' -> Map<neighborKey, {edges:[{type,e,ei}]}> -- membership links built
                            // once in precompute(); access links added incrementally by mergeEdges() as
                            // each share's chunk loads (see linkAdjacency())

/* ------------------------------- Precompute ------------------------------- */

const byIdentity = new Map();  // idx -> [edgeIdx,...]
const byFolder = new Map();    // idx -> [edgeIdx,...]
const folderPathToIdx = new Map(); // path string -> folder idx (REAL folders only)
const folderChildren = new Map();  // nodeId -> [nodeId,...], sorted, built in precompute()
const folderParent = new Map();    // nodeId -> nodeId

// A node id is a real folder's own index (>=0) when the scan actually
// recorded that folder, or a negative "virtual" id standing in for a path
// segment the scan never recorded as its own folder (a share it walked
// non-recursively, an ACL-unchanged folder it skipped, etc.) but that still
// has to exist structurally so a folder several levels deeper nests under
// the right ancestor instead of becoming its own disconnected tree root.
// Without this, any gap in the scanned set turns what should be one deep
// tree into a wall of single-node "roots" that merely LOOK flat.
const virtualNodes = []; // virtualNodes[-id-1] = { path, segment }
function nodeIsReal(id) { return id >= 0; }
function nodePath(id) { return id >= 0 ? DATA.folders[id].path : virtualNodes[-id - 1].path; }
function nodeLabel(id) { return id >= 0 ? lastPathSegment(DATA.folders[id].path) : virtualNodes[-id - 1].segment; }

function ensureNode(path) {
  // Returns the node id for `path`: the real folder if the scan recorded
  // one there, otherwise a virtual node -- creating it, and recursively
  // wiring its own parent the same way, the first time this exact path is
  // asked for. Recursion terminates as soon as it reaches a path already in
  // pathToNodeId (a real folder, or a virtual node created by an earlier
  // call), since that node's own ancestor chain was already wired then.
  if (folderPathToIdx.has(path)) return folderPathToIdx.get(path);
  const segs = path.split('\\').filter(Boolean);
  const id = -(virtualNodes.length + 1);
  virtualNodes.push({ path, segment: segs.length ? segs[segs.length - 1] : path });
  folderPathToIdx.set(path, id);
  if (segs.length > 2) {
    const parentPath = '\\\\' + segs.slice(0, -1).join('\\');
    const parentId = ensureNode(parentPath);
    if (!folderChildren.has(parentId)) folderChildren.set(parentId, []);
    folderChildren.get(parentId).push(id);
    folderParent.set(id, parentId);
  }
  return id;
}

function buildFolderTree() {
  // Parent/child relationships are derived purely from path strings -- a folder
  // is another folder's direct child if its path is exactly one segment longer
  // and starts with the parent's path. Any missing intermediate level gets a
  // virtual node (see ensureNode) rather than breaking the chain, so real
  // folders still nest under their true ancestor even when the scan itself
  // has gaps between them.
  DATA.folders.forEach((f, idx) => folderPathToIdx.set(f.path, idx));
  DATA.folders.forEach((f, idx) => {
    const segs = f.path.split('\\').filter(Boolean);
    if (segs.length <= 2) return; // \\server\share -- a share root has no parent in our data
    const parentPath = '\\\\' + segs.slice(0, -1).join('\\');
    const parentId = ensureNode(parentPath);
    if (!folderChildren.has(parentId)) folderChildren.set(parentId, []);
    folderChildren.get(parentId).push(idx);
    folderParent.set(idx, parentId);
  });
  folderChildren.forEach(list => list.sort((a, b) => cmpText(nodePath(a), nodePath(b))));
}

function computeTopmostRoots(candidateIndices) {
  // Given a set of folders an identity has a direct edge to, a normal
  // recursive audit typically records an ACE row for EVERY folder in a
  // branch (inherited ACEs get captured per-folder) -- so without this, a
  // parent folder and several of its own descendants would each show up as
  // their own separate, duplicated top-level tree root. Keep only the
  // topmost folder per branch; everything beneath it is already reachable
  // by expanding that one root.
  const candidateSet = new Set(candidateIndices);
  return candidateIndices.filter(idx => {
    let p = folderParent.get(idx);
    while (p !== undefined) {
      if (candidateSet.has(p)) return false; // an ancestor is also a candidate -- not topmost
      p = folderParent.get(p);
    }
    return true;
  });
}

let cachedFolderTreeOrder = null;
let cachedFolderTreeOrderDir = null;

function getFolderListInTreeOrder() {
  // A flat lexicographic sort of every folder's own full path string doesn't
  // respect the tree it's actually describing: one folder's own descendants
  // can sort BEHIND an entirely unrelated sibling folder purely because of
  // how their names compare character-by-character (e.g. "\\srv\test2"
  // sorts between "\\srv\test" and "\\srv\test\a", even though the latter is
  // test's own child, not test2's). This instead walks the real tree
  // depth-first, pre-order -- each share (root) in turn, and within it every
  // descendant nested exactly where it belongs -- so a folder's whole branch
  // always reads as one contiguous, alphabetized block, matching how a file
  // explorer's expanded tree would read if flattened into a list. Virtual
  // "not scanned" bridge nodes (see ensureNode) are walked through so their
  // real descendants still land in the right place, but aren't themselves
  // emitted (nothing to select there).
  //
  // Cached and only rebuilt when the sort direction actually changes --
  // search keystrokes and filter toggles re-render the list far more often
  // than that, and re-filtering this cached order is cheap regardless.
  // Compute the ascending (A-Z) linearization once, then reverse the WHOLE
  // sequence for Z-A -- not just each level's own sibling order. "Root on
  // top in A-Z, root on bottom in Z-A" means the parent's own POSITION
  // relative to its children flips too (children-then-parent in Z-A), not
  // just which sibling comes first at any given level. This only makes
  // sense for this flat list; the nested Tree view's own children ordering
  // (see renderFolderNode) reverses sibling order only, since a parent node
  // there can never visually sit below its own children in an expandable
  // widget -- two different UI shapes, two different reversal rules.
  if (cachedFolderTreeOrder && cachedFolderTreeOrderDir === state.sortDir) return cachedFolderTreeOrder;

  const roots = [];
  DATA.folders.forEach((f, idx) => { if (folderParent.get(idx) === undefined) roots.push(idx); });
  roots.sort((a, b) => cmpText(DATA.folders[a].path, DATA.folders[b].path));

  const out = [];
  function visit(nodeId) {
    if (nodeIsReal(nodeId)) out.push(nodeId);
    (folderChildren.get(nodeId) || []).forEach(visit); // already pre-sorted ascending by buildFolderTree
  }
  roots.forEach(visit);

  const finalOrder = state.sortDir === -1 ? out.slice().reverse() : out;
  cachedFolderTreeOrder = finalOrder;
  cachedFolderTreeOrderDir = state.sortDir;
  return finalOrder;
}

function precompute() {
  buildFolderTree();

  // folders[].broken is precomputed by Build-AccessMapHtml.ps1 (it already
  // knows this from InheritanceBrokenHere while it builds each edge) -- no
  // edges need to be loaded client-side to know which folders show the
  // "broken inheritance" badge.

  // Group-membership relationships ("who else is a member of this group")
  // are also global and cheap -- Build-AccessMapHtml.ps1 already resolves
  // every GrantedViaGroup while it streams IdentityPermissions.csv once, so
  // this is built here, eagerly, and never needs a share chunk loaded.
  DATA.identities.forEach((idn, groupIdx) => {
    (idn.members || []).forEach(memberIdx => {
      linkAdjacency('i:' + groupIdx, 'i:' + memberIdx, { type: 'membership' });
    });
  });

  // Per-identity disabled/dormant/locked flags, precomputed once.
  const now = new Date();
  DATA.identities.forEach(idn => {
    idn.flagDisabled = (idn.enabled === false);
    idn.flagLocked = (idn.locked === true);
    idn.flagDormant = false;
    if (idn.lastLogon) {
      const d = new Date(idn.lastLogon);
      if (!isNaN(d.getTime())) {
        const days = (now - d) / (1000 * 60 * 60 * 24);
        if (days > DORMANT_DAYS) idn.flagDormant = true;
      }
    }
  });
}

/* --------------------------------- Helpers -------------------------------- */

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtBool(b) { return b === true ? 'Yes' : (b === false ? 'No' : ''); }
function truncateLabel(s, n) { if (!s) return ''; return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }

function downloadCsv(filename, rows, columns) {
  const header = columns.map(c => c.label).join(',');
  const lines = rows.map(r => columns.map(c => {
    let v = c.get(r);
    if (v === null || v === undefined) v = '';
    v = String(v).replace(/"/g, '""');
    return /[",\n]/.test(v) ? '"' + v + '"' : v;
  }).join(','));
  const csv = [header].concat(lines).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------- Sidebar -------------------------------- */

function renderList() {
  const panel = document.getElementById('listPanel');
  panel.innerHTML = '';
  const q = state.search.trim().toLowerCase();
  const LIMIT = 300;

  if (state.tab === 'identities') {
    let items = DATA.identities.map((idn, idx) => ({ idn, idx }));
    if (q) items = items.filter(x => (x.idn.name || '').toLowerCase().includes(q) ||
                                      (x.idn.dept || '').toLowerCase().includes(q) ||
                                      (x.idn.title || '').toLowerCase().includes(q));
    // filterDormant: 0=off, 1=show only disabled/dormant/locked, 2=hide them
    if (state.filterDormant === 1) items = items.filter(x => x.idn.flagDisabled || x.idn.flagDormant || x.idn.flagLocked);
    else if (state.filterDormant === 2) items = items.filter(x => !(x.idn.flagDisabled || x.idn.flagDormant || x.idn.flagLocked));
    items.sort((a, b) => state.sortDir * cmpText(a.idn.name, b.idn.name));
    const total = items.length;
    items = items.slice(0, LIMIT);
    items.forEach(({ idn, idx }) => {
      const div = document.createElement('div');
      div.className = 'listItem';
      let badges = '';
      if (idn.flagDisabled) badges += '<span class="badge disabled">disabled</span>';
      if (idn.flagLocked) badges += '<span class="badge locked">locked</span>';
      if (idn.flagDormant && !idn.flagDisabled) badges += '<span class="badge dormant">dormant</span>';
      div.innerHTML = `<div>${esc(idn.name || '(unknown)')}${badges}</div><div class="sub">${esc(idn.type || '')}${idn.title ? ' \u00b7 ' + esc(idn.title) : ''}</div>`;
      div.onclick = () => selectIdentity(idx, true);
      panel.appendChild(div);
    });
    if (total === 0) {
      const none = document.createElement('div');
      none.className = 'listMore';
      none.textContent = 'None found.';
      panel.appendChild(none);
    } else if (total > LIMIT) {
      const more = document.createElement('div');
      more.className = 'listMore';
      more.textContent = `${total - LIMIT} more \u2014 refine your search`;
      panel.appendChild(more);
    }
  } else {
    let items = getFolderListInTreeOrder().map(idx => ({ f: DATA.folders[idx], idx }));
    if (q) items = items.filter(x => x.f.path.toLowerCase().includes(q));
    // filterBroken: 0=off, 1=show only broken-inheritance folders, 2=hide them
    if (state.filterBroken === 1) items = items.filter(x => x.f.broken);
    else if (state.filterBroken === 2) items = items.filter(x => !x.f.broken);
    // NOTE: no separate sort here -- getFolderListInTreeOrder() already
    // ordered everything (see there for why a flat string sort isn't used),
    // and .filter() preserves that relative order.
    const total = items.length;
    items = items.slice(0, LIMIT);
    items.forEach(({ f, idx }) => {
      const div = document.createElement('div');
      div.className = 'listItem';
      const badge = f.broken ? '<span class="badge broken">broken inheritance</span>' : '';
      div.innerHTML = `<div>${esc(truncateLabel(f.path, 60))}${badge}</div>`;
      div.title = f.path;
      div.onclick = () => selectFolder(idx, true);
      panel.appendChild(div);
    });
    if (total === 0) {
      const none = document.createElement('div');
      none.className = 'listMore';
      none.textContent = 'None found.';
      panel.appendChild(none);
    } else if (total > LIMIT) {
      const more = document.createElement('div');
      more.className = 'listMore';
      more.textContent = `${total - LIMIT} more \u2014 refine your search`;
      panel.appendChild(more);
    }
  }
}

function setTab(tab) {
  state.tab = tab;
  document.getElementById('tabIdentities').className = tab === 'identities' ? 'active' : '';
  document.getElementById('tabFolders').className = tab === 'folders' ? 'active' : '';
  renderList();
}

/* ----------------------------- Selection / nav ----------------------------- */

function pushHistory() {
  if (state.selected) state.history.push(state.selected);
  document.getElementById('backBtn').disabled = state.history.length === 0;
}

function goBack() {
  if (state.history.length === 0) return;
  const prev = state.history.pop();
  document.getElementById('backBtn').disabled = state.history.length === 0;
  if (prev.kind === 'identity') selectIdentity(prev.idx, false); else selectFolder(prev.idx, false);
}

let selectionToken = 0;

async function selectIdentity(idx, recordHistory) {
  if (recordHistory) pushHistory();
  state.selected = { kind: 'identity', idx };
  state.tableSort = { col: null, dir: 1 };
  state.tableFilter = '';
  setTab('identities');
  const token = ++selectionToken;
  // Usually resolves on the same tick (already loaded, or this identity has
  // no access anywhere) -- the placeholder only actually shows for however
  // long a genuinely new share chunk takes to fetch and register.
  document.getElementById('content').innerHTML = '<div id="welcome">Loading\u2026</div>';
  try {
    await ensureSharesLoaded(DATA.identities[idx].shareKeys);
  } catch (err) {
    if (token !== selectionToken) return;
    document.getElementById('content').innerHTML = `<div id="welcome">Could not load this identity's access data: ${esc(err.message)}</div>`;
    return;
  }
  if (token !== selectionToken) return; // a newer selection superseded this one
  renderIdentity(idx);
}

async function selectFolder(idx, recordHistory) {
  if (recordHistory) pushHistory();
  state.selected = { kind: 'folder', idx };
  state.tableSort = { col: null, dir: 1 };
  state.tableFilter = '';
  setTab('folders');
  const token = ++selectionToken;
  document.getElementById('content').innerHTML = '<div id="welcome">Loading\u2026</div>';
  try {
    await ensureShareLoaded(DATA.folders[idx].share);
  } catch (err) {
    if (token !== selectionToken) return;
    document.getElementById('content').innerHTML = `<div id="welcome">Could not load this folder's access data: ${esc(err.message)}</div>`;
    return;
  }
  if (token !== selectionToken) return;
  renderFolder(idx);
}

/* -------------------------------- Folder tree view --------------------------- */

function lastPathSegment(path) {
  const segs = path.split('\\').filter(Boolean);
  return segs.length ? segs[segs.length - 1] : path;
}

function folderAccessCounts(folderIdx) {
  // Splits a folder's access entries into "direct" (this row's own identity
  // holds an ACE here that isn't itself an expanded group-membership row --
  // covers both an ordinary direct grant AND a group's own listing) versus
  // "via group" (a member shown here only because of a group ACE elsewhere
  // in this same folder's list). Flattening both into one number is what
  // made a group's members look like additional, separately-counted access
  // rather than a breakdown of ONE grant -- see buildFolderAclRows, which
  // uses this same split to nest members under their group instead.
  const edgeIdxs = byFolder.get(folderIdx) || [];
  let direct = 0, viaGroup = 0;
  edgeIdxs.forEach(ei => { if (DATA.edges[ei][6] >= 0) viaGroup++; else direct++; });
  return { direct, viaGroup, total: edgeIdxs.length };
}

function renderFolderNode(nodeId, level, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget) {
  // Builds one folder row plus a (possibly lazily-built) container for its
  // children. Auto-expands up to maxAutoExpandDepth LEVELS deep (level 1 =
  // this node itself, so maxAutoExpandDepth=1 means "just this folder, no
  // children shown yet"); every subfolder's own children always branch from
  // that subfolder specifically, never pooled with a sibling's. Beyond the
  // auto-expand depth, anything with children can still be expanded manually
  // by clicking its toggle, regardless of the depth setting.
  //
  // nodeId can be a REAL folder (>=0, an index into DATA.folders) or a
  // VIRTUAL node (see ensureNode) standing in for a path segment the scan
  // itself never recorded -- shown as a plain, unclickable structural label
  // (no count, no broken badge, nothing to select) so the real folders on
  // either side of the gap still nest correctly instead of each becoming
  // their own disconnected root.
  const isReal = nodeIsReal(nodeId);
  const wrap = document.createElement('div');
  wrap.className = 'treeNode';

  const row = document.createElement('div');
  row.className = 'treeRow' + (nodeId === selectedFolderIdx ? ' selected' : '') + (isReal ? '' : ' virtual');

  const allChildren = folderChildren.get(nodeId) || [];
  const hasChildren = allChildren.length > 0;

  const toggle = document.createElement('span');
  toggle.className = 'treeToggle';
  toggle.textContent = '\u00a0\u00a0';
  row.appendChild(toggle);

  const label = document.createElement('span');
  label.className = 'treeLabel';
  label.textContent = nodeLabel(nodeId);
  label.title = nodePath(nodeId);
  row.appendChild(label);

  if (isReal) {
    const counts = folderAccessCounts(nodeId);
    const countBadge = document.createElement('span');
    countBadge.className = 'treeCount';
    countBadge.textContent = counts.viaGroup > 0 ? `${counts.direct}+${counts.viaGroup}` : String(counts.direct);
    countBadge.title = counts.viaGroup > 0
      ? `${counts.direct} direct access ${counts.direct === 1 ? 'entry' : 'entries'}, plus ${counts.viaGroup} more via group membership`
      : `${counts.direct} direct access ${counts.direct === 1 ? 'entry' : 'entries'} on this folder`;
    row.appendChild(countBadge);

    if (DATA.folders[nodeId].broken) {
      const b = document.createElement('span');
      b.className = 'badge broken';
      b.textContent = 'broken';
      b.title = 'Inheritance is broken here (explicit ACL, not inherited from parent)';
      row.appendChild(b);
    }
    row.onclick = () => onSelectFolder(nodeId);
  } else {
    const note = document.createElement('span');
    note.className = 'virtualNote';
    note.textContent = 'not scanned';
    note.title = 'This folder level wasn\u2019t recorded by the scan itself -- shown only to connect the real folders above and below it in the tree.';
    row.appendChild(note);
    row.onclick = () => { if (hasChildren) setExpanded(!expanded); };
  }
  wrap.appendChild(row);

  const childHost = document.createElement('div');
  childHost.className = 'treeChildren';
  wrap.appendChild(childHost);

  let expanded = false;
  let built = false;

  function buildChildren() {
    if (built) return;
    built = true;
    // allChildren is stored sorted ascending (see buildFolderTree); reversing
    // it here reflects the sidebar's own A-Z/Z-A toggle in the tree too,
    // without needing to re-sort the underlying structure on every toggle.
    const ordered = state.sortDir === -1 ? allChildren.slice().reverse() : allChildren;
    const shown = ordered.slice(0, TREE_CHILD_CAP);
    shown.forEach(childId => {
      childHost.appendChild(renderFolderNode(childId, level + 1, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget));
    });
    if (allChildren.length > TREE_CHILD_CAP) {
      const more = document.createElement('div');
      more.className = 'treeMore';
      more.textContent = `+ ${allChildren.length - TREE_CHILD_CAP} more subfolder(s) not shown here -- select this folder to see everything in the table below.`;
      childHost.appendChild(more);
    }
  }

  function setExpanded(v) {
    expanded = v;
    if (expanded) buildChildren();
    childHost.style.display = expanded ? 'block' : 'none';
    if (hasChildren) toggle.textContent = expanded ? '\u25be' : '\u25b8';
  }

  if (hasChildren) {
    toggle.classList.add('hasChildren');
    toggle.onclick = (e) => { e.stopPropagation(); setExpanded(!expanded); };
  }

  const shouldAutoExpand = hasChildren && level < maxAutoExpandDepth && expandBudget.count < TREE_AUTO_EXPAND_CAP;
  if (shouldAutoExpand) expandBudget.count++;
  setExpanded(shouldAutoExpand);

  return wrap;
}

function renderFolderTreeView(rootFolderIndices, onSelectFolder, selectedFolderIdx, onDepthChange) {
  // rootFolderIndices: one root (folder-centered view) or several (identity-
  // centered view -- every folder that identity directly accesses, each
  // getting its own independent tree; nothing here ever reaches OUTSIDE those
  // specific roots' own subfolder structure, so there is no path for an
  // unrelated part of the tree to leak in the way a relationship-hop graph
  // could -- see the depth toolbar's hint text for what depth means here).
  const wrap = document.createElement('div');
  wrap.className = 'treeWrap';

  const toolbar = document.createElement('div');
  toolbar.className = 'treeToolbar';
  const depthLabel = document.createElement('span');
  depthLabel.className = 'groupLabel';
  depthLabel.textContent = 'Depth:';
  toolbar.appendChild(depthLabel);
  [1, 2, 3, 4, 5, 'Full'].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'depthBtn' + ((d === 'Full' ? Infinity : d) === state.depth ? ' active' : '');
    btn.textContent = String(d);
    btn.onclick = () => { state.depth = (d === 'Full' ? Infinity : d); onDepthChange(); };
    toolbar.appendChild(btn);
  });
  const hint = document.createElement('span');
  hint.className = 'groupLabel';
  hint.textContent = 'Depth = how many levels of subfolders to auto-expand \u00b7 each subfolder\'s own children branch from it, not a shared pool \u00b7 click the \u25b8 to expand/collapse manually \u00b7 click a folder name to select it';
  toolbar.appendChild(hint);
  wrap.appendChild(toolbar);

  const maxAutoExpandDepth = state.depth === Infinity ? Infinity : state.depth;
  const expandBudget = { count: 0 };
  const treeHost = document.createElement('div');
  treeHost.className = 'treeHost';
  rootFolderIndices.forEach(rootIdx => {
    treeHost.appendChild(renderFolderNode(rootIdx, 1, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget));
  });
  wrap.appendChild(treeHost);

  if (expandBudget.count >= TREE_AUTO_EXPAND_CAP) {
    const note = document.createElement('div');
    note.className = 'treeNote';
    note.textContent = `This tree is large -- auto-expansion stopped after ${TREE_AUTO_EXPAND_CAP} folders to stay responsive. Anything still collapsed can be expanded manually by clicking its \u25b8, or reduce depth.`;
    wrap.appendChild(note);
  }

  return wrap;
}

/* -------------------------------- Simple 1-hop graph -------------------------- */
/* The picture view: center node plus its DIRECT relationships only (no
   multi-hop traversal, so none of the earlier hub-explosion/unrelated-
   relationship issues can recur here -- it always shows exactly what the
   Tree tab's root row plus the table below it already shows, just as a
   visual instead of a list). Purely a rendering choice alongside the Tree
   tab; both read from the same underlying edges. */

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
  return el;
}

function bestEdgeScore(edgeInfo) {
  let best = -1;
  edgeInfo.edges.forEach(d => {
    const s = d.type === 'membership' ? 40 : ((d.e[3] ? 0 : 1000) + RIGHTS_WEIGHT[d.e[2]]);
    if (s > best) best = s;
  });
  return best;
}

function isExpandable(key, isCenter) {
  // Gates what a node reveals when the BFS steps OUT of it (not whether it
  // appears at all). The center is always fully expanded. Beyond that:
  //   - Folders: always fully expandable.
  //   - Unresolved / Well-known, not centered: 'none' -- frequent accidental
  //     hubs (a stale SID on hundreds of ACLs, a default group on nearly
  //     everything) with little signal once you know what they are.
  //   - Groups, not centered: 'membershipOnly' -- reveal other members, not
  //     the group's own reach into unrelated folders.
  //   - Users, not centered: 'full' UNLESS their total fan-out (degree)
  //     exceeds HUB_DEGREE_THRESHOLD, in which case 'membershipOnly' too --
  //     an admin/service account with a huge footprint is just as much a
  //     hub as a broadly-permissioned group.
  if (isCenter) return 'full';
  if (key[0] === 'f') return 'full';
  const idx = parseInt(key.slice(2), 10);
  const idn = DATA.identities[idx];
  if (idn.type === 'Unresolved' || idn.type === 'Well-known / Local') return 'none';
  if (idn.type === 'Group') return 'membershipOnly';
  // edgeCount is precomputed server-side across the WHOLE dataset (not just
  // shares loaded so far) -- using byIdentity's size here instead would
  // under-count a hub identity until every one of its shares happened to
  // already be loaded, letting a real hub slip through as 'full'.
  const degree = idn.edgeCount || 0;
  if (degree > HUB_DEGREE_THRESHOLD) return 'membershipOnly';
  return 'full';
}

async function buildEgoGraph(centerKey, depth, cap, perSourceCap) {
  const visited = new Map();
  visited.set(centerKey, { hop: 0, from: null });
  let frontier = [centerKey];
  const layers = [[centerKey]];
  let truncated = false;

  for (let hop = 1; hop <= depth && visited.size < cap; hop++) {
    const candidates = [];
    for (const fKey of frontier) {
      const mode = isExpandable(fKey, fKey === centerKey);
      if (mode === 'none') continue;
      // A folder's own share is always already loaded by the time it can
      // appear here (it was only ever discovered via an edge that came from
      // a loaded chunk). An identity being expanded 'full' reveals its own
      // access edges too, which may live in shares not loaded yet -- load
      // them now. 'membershipOnly' only needs membership links, which are
      // global/eager (see precompute()), so nothing to load for that case.
      if (mode === 'full' && fKey[0] === 'i') {
        const idx = parseInt(fKey.slice(2), 10);
        await ensureSharesLoaded(DATA.identities[idx].shareKeys);
      }
      const nbrs = adjacency.get(fKey) || new Map();
      const fromThisSource = [];
      nbrs.forEach((edgeInfo, nKey) => {
        if (visited.has(nKey)) return;
        if (mode === 'membershipOnly' && !edgeInfo.edges.some(d => d.type === 'membership')) return;
        fromThisSource.push({ nKey, fromKey: fKey, edgeInfo, score: bestEdgeScore(edgeInfo) });
      });
      fromThisSource.sort((a, b) => b.score - a.score);
      if (fromThisSource.length > perSourceCap) truncated = true;
      candidates.push(...fromThisSource.slice(0, perSourceCap));
    }
    const bestByKey = new Map();
    candidates.forEach(c => {
      const existing = bestByKey.get(c.nKey);
      if (!existing || c.score > existing.score) bestByKey.set(c.nKey, c);
    });
    let sorted = Array.from(bestByKey.values()).sort((a, b) => b.score - a.score);
    const budget = cap - visited.size;
    if (sorted.length > budget) truncated = true;
    sorted = sorted.slice(0, Math.max(0, budget));
    const nextFrontier = [];
    sorted.forEach(c => {
      visited.set(c.nKey, { hop, from: c.fromKey, edgeInfo: c.edgeInfo });
      nextFrontier.push(c.nKey);
    });
    layers.push(nextFrontier);
    frontier = nextFrontier;
    if (nextFrontier.length === 0) break;
  }
  return { visited, layers, truncated };
}

function layoutRadial(layers, visited) {
  // Concentric rings by hop distance; within a ring, nodes are angularly
  // clustered near their parent's angle so related nodes stay visually
  // grouped instead of scattering randomly.
  const positions = new Map();
  positions.set(layers[0][0], { x: 0, y: 0, angle: 0 });
  for (let hop = 1; hop < layers.length; hop++) {
    const nodesThisHop = layers[hop];
    if (nodesThisHop.length === 0) continue;
    const byParent = new Map();
    nodesThisHop.forEach(k => {
      const p = visited.get(k).from;
      if (!byParent.has(p)) byParent.set(p, []);
      byParent.get(p).push(k);
    });
    const parentKeys = Array.from(byParent.keys()).sort((a, b) =>
      (positions.get(a) ? positions.get(a).angle : 0) - (positions.get(b) ? positions.get(b).angle : 0));
    const total = nodesThisHop.length;
    parentKeys.forEach(p => {
      const kids = byParent.get(p);
      const parentAngle = positions.get(p) ? positions.get(p).angle : 0;
      const arcWidth = (kids.length / total) * 2 * Math.PI;
      const startAngle = parentAngle - arcWidth / 2;
      kids.forEach((k, i) => {
        const angle = kids.length === 1 ? parentAngle : startAngle + (arcWidth * (i + 0.5) / kids.length);
        positions.set(k, { angle, x: 0, y: 0 });
      });
    });
  }
  layers.forEach((nodesThisHop, hop) => {
    const radius = hop * RING_SPACING;
    nodesThisHop.forEach(k => {
      const pos = positions.get(k);
      pos.x = radius * Math.cos(pos.angle - Math.PI / 2);
      pos.y = radius * Math.sin(pos.angle - Math.PI / 2);
    });
  });
  return positions;
}

function nodeDisplayInfo(key) {
  const kind = key[0], idx = parseInt(key.slice(2), 10);
  if (kind === 'f') {
    const f = DATA.folders[idx];
    return { label: lastPathSegment(f.path), full: f.path, color: '#57d3d3', flagged: f.broken };
  }
  const idn = DATA.identities[idx];
  return { label: idn.name, full: idn.name, color: TYPE_COLORS[idn.type] || '#7d8a99', flagged: idn.flagDisabled || idn.flagDormant || idn.flagLocked };
}

function edgeDisplayInfo(edgeInfo) {
  let best = null, bestScore = -1;
  edgeInfo.edges.forEach(d => {
    const s = d.type === 'membership' ? 40 : ((d.e[3] ? 0 : 1000) + RIGHTS_WEIGHT[d.e[2]]);
    if (s > bestScore) { bestScore = s; best = d; }
  });
  if (best.type === 'membership') return { label: 'Member of', color: '#c084fc', dashed: true };
  const e = best.e;
  let label = RIGHTS_LABELS[e[2]];
  if (e[5]) label = 'Deny ' + label;
  return { label, color: EDGE_COLORS[e[2]], dashed: !!e[3] };
}

let graphRenderToken = 0;

function renderRelationshipGraph(kind, idx, onNavigate, onDepthChange) {
  // Returns a placeholder synchronously (so the caller can appendChild it
  // right away, same as before) and swaps in the real graph once this
  // node's own share(s) -- and anything the BFS expands into -- are loaded.
  const holder = document.createElement('div');
  holder.className = 'graphWrap';
  const note = document.createElement('div');
  note.className = 'graphNote';
  note.textContent = 'Loading relationship data\u2026';
  holder.appendChild(note);

  const centerKey = (kind === 'folder' ? 'f:' : 'i:') + idx;
  const depth = state.graphDepth === Infinity ? 999 : state.graphDepth;
  const token = ++graphRenderToken;

  (async () => {
    try {
      if (kind === 'folder') await ensureShareLoaded(DATA.folders[idx].share);
      else await ensureSharesLoaded(DATA.identities[idx].shareKeys);
      const g = await buildEgoGraph(centerKey, depth, GRAPH_NODE_CAP, MAX_EDGES_PER_NODE);
      if (token !== graphRenderToken) return; // a newer selection superseded this one
      const positions = layoutRadial(g.layers, g.visited);
      const built = renderRelationshipGraphInner(g, positions, centerKey, onNavigate, onDepthChange);
      holder.replaceWith(built);
    } catch (err) {
      if (token !== graphRenderToken) return;
      note.textContent = 'Could not load relationship data: ' + err.message;
    }
  })();

  return holder;
}

function renderRelationshipGraphInner(g, positions, centerKey, onNavigate, onDepthChange) {
  const wrap = document.createElement('div');
  wrap.className = 'graphWrap';

  const toolbar = document.createElement('div');
  toolbar.className = 'graphToolbar';
  const depthLabel = document.createElement('span');
  depthLabel.className = 'groupLabel';
  depthLabel.textContent = 'Depth:';
  toolbar.appendChild(depthLabel);
  [1, 2, 3, 4, 5, 'Full'].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'depthBtn' + ((d === 'Full' ? Infinity : d) === state.graphDepth ? ' active' : '');
    btn.textContent = String(d);

    toolbar.appendChild(btn);
  });
  const btnOut = document.createElement('button'); btnOut.className = 'zoomBtn'; btnOut.textContent = '\u2212'; btnOut.title = 'Zoom out';
  const btnIn = document.createElement('button'); btnIn.className = 'zoomBtn'; btnIn.textContent = '+'; btnIn.title = 'Zoom in';
  const btnReset = document.createElement('button'); btnReset.className = 'zoomBtn'; btnReset.textContent = '\u2317'; btnReset.title = 'Reset view';
  toolbar.appendChild(btnOut); toolbar.appendChild(btnIn); toolbar.appendChild(btnReset);
  const hint = document.createElement('span');
  hint.className = 'groupLabel';
  hint.textContent = 'Depth = relationship hops from center \u00b7 groups/well-known/high-fan-out accounts show only direct reach unless centered \u00b7 scroll to zoom \u00b7 drag background to pan \u00b7 drag a node to move it \u00b7 click a node to follow it';
  toolbar.appendChild(hint);
  wrap.appendChild(toolbar);

  const legendToggle = document.createElement('button');
  legendToggle.className = 'graphLegendToggle';
  legendToggle.textContent = 'i';
  legendToggle.title = 'Show legend';
  wrap.appendChild(legendToggle);

  const legendPanel = document.createElement('div');
  legendPanel.className = 'graphLegendPanel';
  legendPanel.style.display = 'none';
  function legendSection(title, rows) {
    const h = document.createElement('h4');
    h.textContent = title;
    legendPanel.appendChild(h);
    rows.forEach(row => legendPanel.appendChild(row));
  }
  function swatchRow(color, label) {
    const row = document.createElement('div');
    row.className = 'graphLegendRow';
    const sw = document.createElement('span');
    sw.className = 'graphLegendSwatch';
    sw.style.background = color;
    row.appendChild(sw);
    const lbl = document.createElement('span');
    lbl.textContent = label;
    row.appendChild(lbl);

    row.className = 'graphLegendRow';
    const ln = document.createElement('span');
    ln.className = 'graphLegendLine' + (dashed ? ' dashed' : '');
    ln.style.borderTopColor = color;
    row.appendChild(ln);
    const lbl = document.createElement('span');
    lbl.textContent = label;
    row.appendChild(lbl);
    return row;
  }
  legendSection('Nodes', [
    swatchRow('#ffb454', 'Center (current selection)'),
    swatchRow('#57d3d3', 'Folder'),
    swatchRow(TYPE_COLORS.User, 'User'),
    swatchRow(TYPE_COLORS.Group, 'Group'),
    swatchRow(TYPE_COLORS.Computer, 'Computer'),
    swatchRow(TYPE_COLORS['Well-known / Local'], 'Well-known / Local / Unresolved')
  ]);
  const flagRow = document.createElement('div');
  flagRow.className = 'graphLegendRow';
  const dot = document.createElement('span');
  dot.className = 'graphLegendDot';
  flagRow.appendChild(dot);
  const flagLbl = document.createElement('span');
  flagLbl.textContent = 'Broken inheritance (folder) / disabled, locked, or dormant (identity)';
  flagRow.appendChild(flagLbl);
  legendPanel.appendChild(flagRow);
  legendSection('Access rights', RIGHTS_LABELS.map((label, i) => swatchRow(EDGE_COLORS[i], label)));
  legendSection('Lines', [
    lineRow('#7d8a99', 'Solid = explicit access', false),
    lineRow('#7d8a99', 'Dashed = inherited access', true),
    lineRow('#c084fc', 'Dashed = group membership', true)
  ]);
  wrap.appendChild(legendPanel);
  legendToggle.onclick = () => {
    const showing = legendPanel.style.display !== 'none';
    legendPanel.style.display = showing ? 'none' : 'block';
    legendToggle.title = showing ? 'Show legend' : 'Hide legend';
  };

  let maxAbs = 60;
  positions.forEach(p => { maxAbs = Math.max(maxAbs, Math.abs(p.x), Math.abs(p.y)); });
  const half = maxAbs + 140;
  const vbW = half * 2, vbH = vbW * (520 / 900);
  const vb = { x: -vbW / 2, y: -vbH / 2, w: vbW, h: vbH };

  const svg = svgEl('svg', { class: 'graph', viewBox: `${vb.x} ${vb.y} ${vb.w} ${vb.h}`, xmlns: 'http://www.w3.org/2000/svg' });
  const edgesLayer = svgEl('g', {});
  const nodesLayer = svgEl('g', {});
  svg.appendChild(edgesLayer);
  svg.appendChild(nodesLayer);
  wrap.appendChild(svg);

  const linesByNode = new Map();
  function trackLine(key, el, xAttr, yAttr) {
    if (!linesByNode.has(key)) linesByNode.set(key, []);
    linesByNode.get(key).push({ el, xAttr, yAttr });
  }

  const allKeys = [].concat(...g.layers);
  g.layers.forEach((layerKeys, hop) => {
    if (hop === 0) return;
    layerKeys.forEach(key => {
      const info = g.visited.get(key);
      const parentPos = positions.get(info.from);
      const pos = positions.get(key);
      const edisp = edgeDisplayInfo(info.edgeInfo);
      const line = svgEl('line', {
        x1: parentPos.x, y1: parentPos.y, x2: pos.x, y2: pos.y,
        stroke: edisp.color, 'stroke-width': edisp.dashed ? 1.5 : 3,
        'stroke-dasharray': edisp.dashed ? '5,4' : 'none', opacity: 0.85
      });
      edgesLayer.appendChild(line);
      trackLine(info.from, line, 'x1', 'y1');
      trackLine(key, line, 'x2', 'y2');
      const midx = (parentPos.x + pos.x) / 2, midy = (parentPos.y + pos.y) / 2;
      const lbl = svgEl('text', { class: 'edgeLabel', x: midx, y: midy, 'text-anchor': 'middle' });
      lbl.textContent = edisp.label;
      edgesLayer.appendChild(lbl);
    });
  });

  function buildNode(key, pos, isCenter) {
    const info = nodeDisplayInfo(key);
    const r = isCenter ? 26 : 17;
    const group = svgEl('g', { class: 'nodeGroup', transform: `translate(${pos.x},${pos.y})`, 'data-key': key });
    group.appendChild(svgEl('circle', { class: 'nodeCircle' + (isCenter ? ' centerCircle' : ''), r, fill: isCenter ? undefined : info.color }));
    if (info.flagged && !isCenter) {
      group.appendChild(svgEl('circle', { cx: r * 0.7, cy: -r * 0.7, r: 5, fill: '#ffb454', stroke: '#000', 'stroke-width': 0.5, class: 'flagRing' }));
    }
    const nameLbl = svgEl('text', { class: 'nodeLabel', x: 0, y: r + 16, 'text-anchor': 'middle' });
    nameLbl.textContent = truncateLabel(info.label, 22);
    group.appendChild(nameLbl);
    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = info.full;
    group.appendChild(title);
    nodesLayer.appendChild(group);
    return group;
  }

  function attachDragHandlers(group, key, pos, isCenter) {
    let dragging = false, moved = false, startClientX = 0, startClientY = 0, startX = pos.x, startY = pos.y;
    function clientToSvgScale() {
      const rect = svg.getBoundingClientRect ? svg.getBoundingClientRect() : null;
      const vbNow = svg.viewBox && svg.viewBox.baseVal ? svg.viewBox.baseVal : vb;
      const clientW = (rect && rect.width) ? rect.width : 900;
      const clientH = (rect && rect.height) ? rect.height : 520;
      return { sx: vbNow.width / clientW, sy: vbNow.height / clientH };
    }
    function onMouseMove(e) {
      if (!dragging) return;
      const scale = clientToSvgScale();
      const dx = (e.clientX - startClientX) * scale.sx;
      const dy = (e.clientY - startClientY) * scale.sy;
      if (Math.abs(e.clientX - startClientX) > 2 || Math.abs(e.clientY - startClientY) > 2) moved = true;
      const nx = startX + dx, ny = startY + dy;
      group.setAttribute('transform', `translate(${nx},${ny})`);
      pos.x = nx; pos.y = ny;
      (linesByNode.get(key) || []).forEach(l => {
        l.el.setAttribute(l.xAttr, nx);
        l.el.setAttribute(l.yAttr, ny);
      });
    }
    function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      dragging = false;
      // The center is already the current selection -- dragging it around is
      // still useful (decluttering a busy graph), but clicking it to
      // "navigate to itself" would be a no-op at best, so only non-center
      // nodes trigger navigation on a genuine (non-drag) click.
      if (!moved && !isCenter) onNavigate(key);
    }
    group.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      dragging = true; moved = false;
      startClientX = e.clientX; startClientY = e.clientY;
      startX = pos.x; startY = pos.y;
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  }

  const centerGroup = buildNode(centerKey, positions.get(centerKey), true);
  attachDragHandlers(centerGroup, centerKey, positions.get(centerKey), true);

  allKeys.forEach(key => {
    if (key === centerKey) return;
    const pos = positions.get(key);
    const group = buildNode(key, pos, false);
    attachDragHandlers(group, key, pos, false);
  });

  let panning = false, panStartClientX = 0, panStartClientY = 0, panStartVb = null;
  svg.addEventListener('mousedown', (e) => {
    if (e.target !== svg) return;
    panning = true;
    panStartClientX = e.clientX; panStartClientY = e.clientY;
    const cur = svg.getAttribute('viewBox').split(' ').map(Number);
    panStartVb = { x: cur[0], y: cur[1], w: cur[2], h: cur[3] };
  });
  document.addEventListener('mousemove', (e) => {
    if (!panning) return;
    const rect = svg.getBoundingClientRect ? svg.getBoundingClientRect() : null;
    const clientW = (rect && rect.width) ? rect.width : 900;
    const clientH = (rect && rect.height) ? rect.height : 520;
    const dx = (e.clientX - panStartClientX) * (panStartVb.w / clientW);
    const dy = (e.clientY - panStartClientY) * (panStartVb.h / clientH);
    svg.setAttribute('viewBox', `${panStartVb.x - dx} ${panStartVb.y - dy} ${panStartVb.w} ${panStartVb.h}`);
  });
  document.addEventListener('mouseup', () => { panning = false; });

  const MIN_W = 200, MAX_W = 6000;
  function zoomBy(factor, clientX, clientY) {
    const cur = svg.getAttribute('viewBox').split(' ').map(Number);
    let [x, y, w, h] = cur;
    const newW = Math.min(MAX_W, Math.max(MIN_W, w * factor));
    const ratio = newW / w;
    const newH = h * ratio;
    let anchorX = x + w / 2, anchorY = y + h / 2;
    if (clientX !== undefined) {
      const rect = svg.getBoundingClientRect ? svg.getBoundingClientRect() : null;
      if (rect && rect.width) {
        anchorX = x + (clientX - rect.left) * (w / rect.width);
        anchorY = y + (clientY - rect.top) * (h / rect.height);
      }
    }
    const newX = anchorX - (anchorX - x) * ratio;
    const newY = anchorY - (anchorY - y) * ratio;
    svg.setAttribute('viewBox', `${newX} ${newY} ${newW} ${newH}`);
  }
  svg.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(e.deltaY > 0 ? 1.15 : (1 / 1.15), e.clientX, e.clientY); }, { passive: false });
  btnIn.onclick = () => zoomBy(1 / 1.3);
  btnOut.onclick = () => zoomBy(1.3);
  btnReset.onclick = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);

  if (g.truncated) {
    const note = document.createElement('div');
    note.className = 'graphNote';
    note.textContent = `Some connections at this depth were too numerous to draw (kept the ${MAX_EDGES_PER_NODE} most notable per node, and ${GRAPH_NODE_CAP} nodes overall). Reduce depth, or use the table below for the complete, uncapped list of the CENTER's own direct relationships.`;
    wrap.appendChild(note);
  }

  return wrap;
}

function renderTable(rows, columns, opts) {
  // columns: [{ key, label, get(row), sortable }]
  // The filter <input> (and the table/toolbar shells) are created exactly ONCE
  // here and never torn down again for the lifetime of this table -- typing a
  // character calls update() below, which only touches the header cells, the
  // tbody rows, and the export button's row count. Rebuilding the whole
  // container (including the input itself) on every keystroke was the earlier
  // approach, and it silently stole focus after each character since the
  // browser can't keep focus on an element that no longer exists.
  const container = document.createElement('div');

  const toolbar = document.createElement('div');
  toolbar.className = 'tableToolbar';
  const filterInput = document.createElement('input');
  filterInput.placeholder = 'Filter this table...';
  filterInput.value = state.tableFilter;
  toolbar.appendChild(filterInput);
  const exportBtn = document.createElement('button');
  toolbar.appendChild(exportBtn);
  container.appendChild(toolbar);

  const table = document.createElement('table');
  table.className = 'datatable';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  container.appendChild(table);

  const note = document.createElement('div');
  note.className = 'graphNote';
  container.appendChild(note);

  function computeFilteredSorted() {
    let filtered = rows;
    const q = state.tableFilter.trim().toLowerCase();
    if (q) {
      filtered = rows.filter(r => columns.some(c => String(c.get(r) || '').toLowerCase().includes(q)));
    }
    if (state.tableSort.col) {
      const col = columns.find(c => c.key === state.tableSort.col);
      if (col) {
        filtered = filtered.slice().sort((a, b) => {
          const va = col.get(a), vb = col.get(b);
          if (va < vb) return -1 * state.tableSort.dir;
          if (va > vb) return 1 * state.tableSort.dir;
          return 0;
        });
      }
    }
    return filtered;
  }

  const RENDER_LIMIT = 2000;

  function update() {
    const filtered = computeFilteredSorted();

    trh.innerHTML = '';
    columns.forEach(c => {
      const th = document.createElement('th');
      let arrow = '';
      if (state.tableSort.col === c.key) arrow = state.tableSort.dir === 1 ? ' \u25b2' : ' \u25bc';
      th.textContent = c.label + arrow;
      th.onclick = () => {
        if (state.tableSort.col === c.key) state.tableSort.dir *= -1;
        else state.tableSort = { col: c.key, dir: 1 };
        update();
      };
      trh.appendChild(th);
    });

    tbody.innerHTML = '';
    filtered.slice(0, RENDER_LIMIT).forEach(r => {
      const tr = document.createElement('tr');
      if (opts.onRowClick) { tr.className = 'rowclick'; tr.onclick = () => opts.onRowClick(r); }
      columns.forEach(c => {
        const td = document.createElement('td');
        if (c.html) td.innerHTML = c.html(r); else td.textContent = c.get(r);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    exportBtn.textContent = `Export ${filtered.length} row(s) as CSV`;
    exportBtn.onclick = () => downloadCsv(opts.filename, filtered, columns.map(c => ({ label: c.label, get: c.get })));

    note.textContent = filtered.length > RENDER_LIMIT
      ? `Showing first ${RENDER_LIMIT} of ${filtered.length} filtered rows. Narrow the filter, or use Export to get all of them.`
      : '';
  }

  filterInput.oninput = (e) => { state.tableFilter = e.target.value; update(); };

  update();
  return container;
}

function renderIdentity(idx) {
  const idn = DATA.identities[idx];
  const content = document.getElementById('content');
  content.innerHTML = '';

  const edgeIdxs = byIdentity.get(idx) || [];
  const allRows = edgeIdxs.map(ei => ({ ei, e: DATA.edges[ei] }));

  content.appendChild(renderDetailTabs(() => renderIdentity(idx)));

  if (state.detailTab === 'graph') {
    content.appendChild(renderRelationshipGraph('identity', idx, (key) => {
      const kind = key[0], kidx = parseInt(key.slice(2), 10);
      if (kind === 'f') selectFolder(kidx, true); else selectIdentity(kidx, true);
    }, () => renderIdentity(idx)));
  } else {
    // Every distinct folder this identity directly accesses becomes its OWN tree
    // root -- each expands into its own subfolder structure independently, with
    // no relationship-hop traversal through other identities/groups at all, so
    // there's no way for something outside this identity's own access to appear.
    // computeTopmostRoots collapses a folder-and-several-of-its-own-descendants
    // (common with inherited ACEs recorded per-folder) down to just the topmost
    // one per branch, so a subfolder never shows up as a duplicate second root.
    const allAccessedFolders = Array.from(new Set(allRows.map(r => r.e[0])));
    const rootFolderIndices = computeTopmostRoots(allAccessedFolders)
      .sort((a, b) => state.sortDir * cmpText(DATA.folders[a].path, DATA.folders[b].path));

    content.appendChild(renderFolderTreeView(
      rootFolderIndices,
      (folderIdx) => selectFolder(folderIdx, true),
      null, // no single "selected" folder highlight makes sense from an identity view with multiple roots
      () => renderIdentity(idx)
    ));

  const columns = [
    { key: 'path', label: 'Path', get: r => DATA.folders[r.e[0]].path },
    { key: 'rights', label: 'Rights', get: r => RIGHTS_LABELS[r.e[2]] },

    { key: 'deny', label: 'Deny', get: r => r.e[5] ? 'Yes' : 'No' },
    { key: 'via', label: 'Granted via group', get: r => r.e[6] >= 0 ? DATA.identities[r.e[6]].name : '' }
  ];
  const tableHost = document.createElement('div');
  tableHost.appendChild(renderTable(allRows, columns, {
    filename: `access_${(idn.name||'identity').replace(/[^a-z0-9]+/gi,'_')}.csv`,
    onRowClick: (r) => selectFolder(r.e[0], true)
  }));
  content.appendChild(tableHost);
}
