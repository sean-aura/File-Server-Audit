<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Server Access Map</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --panel2: #20262f; --border: #2c333d;
    --text: #e6e9ee; --muted: #9aa4b2; --accent: #4da3ff; --warn: #ffb454; --bad: #ff5d5d;
    --good: #57d38c;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; background:var(--panel); flex-shrink:0; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .stats { font-size:12px; color:var(--muted); }
  header .quickfilters { margin-left:auto; display:flex; gap:8px; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px 10px; cursor:pointer; font-size:12px; }
  button:hover { background:#28303b; }
  button.warnbtn { border-color:var(--warn); color:var(--warn); }
  button.badbtn { border-color:var(--bad); color:var(--bad); }
  #main { flex:1; display:flex; min-height:0; }
  #sidebar { width:320px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--panel); }
  #sidebar .tabs { display:flex; border-bottom:1px solid var(--border); }
  #sidebar .tabs button { flex:1; border:none; border-radius:0; background:transparent; padding:10px; }
  #sidebar .tabs button.active { background:var(--panel2); border-bottom:2px solid var(--accent); }
  #searchBox { margin:10px; padding:8px; border-radius:4px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  #listPanel { flex:1; overflow-y:auto; padding:0 6px 10px; }
  .listItem { padding:8px 10px; border-radius:4px; cursor:pointer; font-size:13px; margin-bottom:2px; }
  .listItem:hover { background:var(--panel2); }
  .listItem .sub { color:var(--muted); font-size:11px; }
  .badge { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; margin-left:6px; vertical-align:middle; }
  .badge.disabled { background:var(--bad); color:#fff; }
  .badge.dormant { background:var(--warn); color:#000; }
  .badge.locked { background:var(--bad); color:#fff; }
  .badge.broken { background:var(--warn); color:#000; }
  .listMore { padding:8px 10px; color:var(--muted); font-size:11px; font-style:italic; }
  #content { flex:1; overflow-y:auto; padding:16px; min-width:0; }
  #welcome { color:var(--muted); max-width:600px; }
  #welcome ul { line-height:1.8; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:14px 16px; margin-bottom:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .card .field { display:inline-block; min-width:220px; margin:2px 18px 2px 0; font-size:13px; }
  .card .field b { color:var(--muted); font-weight:500; }
  .treeWrap { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px; margin-bottom:16px; }
  .treeToolbar { display:flex; align-items:center; gap:14px; padding:2px 6px 8px; flex-wrap:wrap; border-bottom:1px solid var(--border); margin-bottom:6px; }
  .treeToolbar .groupLabel { font-size:11px; color:var(--muted); margin-right:2px; }
  .depthBtn { padding:4px 9px; font-size:11px; }
  .depthBtn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .treeNote { font-size:11px; color:var(--muted); padding:4px 8px; }
  .treeHost { max-height:520px; overflow-y:auto; padding:4px 6px; }
  .treeNode { }
  .treeRow { display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:4px; cursor:pointer; font-size:13px; }
  .treeRow:hover { background:var(--panel2); }
  .treeRow.selected { background:#20304a; outline:1px solid var(--accent); }
  .treeToggle { display:inline-block; width:14px; text-align:center; color:var(--muted); flex-shrink:0; }
  .treeToggle.hasChildren { cursor:pointer; }
  .treeToggle.hasChildren:hover { color:var(--text); }
  .treeLabel { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .treeCount { font-size:10px; color:var(--muted); background:var(--panel2); border-radius:8px; padding:1px 7px; flex-shrink:0; }
  .treeChildren { margin-left:20px; padding-left:10px; border-left:1px solid var(--border); }
  .treeMore { font-size:11px; color:var(--muted); font-style:italic; padding:3px 6px 3px 26px; }
  table.datatable { width:100%; border-collapse:collapse; font-size:12px; }
  table.datatable th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); cursor:pointer; color:var(--muted); position:sticky; top:0; background:var(--panel); user-select:none; }
  table.datatable th:hover { color:var(--text); }
  table.datatable td { padding:5px 8px; border-bottom:1px solid #22272e; }
  table.datatable tr.rowclick { cursor:pointer; }
  table.datatable tr.rowclick:hover td { background:var(--panel2); }
  .tableToolbar { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .tableToolbar input { flex:1; padding:6px; border-radius:4px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  .pill { padding:2px 6px; border-radius:3px; font-size:10px; }
  .pill.inherited { background:#2c333d; color:var(--muted); }
  .pill.explicit { background:#2c4a3d; color:var(--good); }
  .pill.deny { background:var(--bad); color:#fff; }
  #backBtn:disabled { opacity:0.4; cursor:default; }
  footer { padding:6px 16px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>File Server Access Map</h1>
    <button id="backBtn" disabled>&larr; Back</button>
    <div class="stats" id="statsLine"></div>
    <div class="quickfilters">
      <button id="btnBroken" class="warnbtn">Broken inheritance folders</button>
      <button id="btnDormant" class="badbtn">Disabled / dormant identities</button>
    </div>
  </header>
  <div id="main">
    <div id="sidebar">
      <div class="tabs">
        <button id="tabIdentities" class="active">Identities</button>
        <button id="tabFolders">Folders</button>
      </div>
      <input id="searchBox" type="text" placeholder="Search...">
      <div id="listPanel"></div>
    </div>
    <div id="content">
      <div id="welcome"></div>
    </div>
  </div>
  <footer id="footerLine"></footer>
</div>

<script>
'use strict';

/* ---------------------------------------------------------------------------
   Embedded data. Build-AccessMapHtml.ps1 replaces the literal below with the
   real JSON payload (identities/folders/edges) at generation time, so this
   file is fully self-contained -- no fetch(), no external files, works from
   file:// with no server.
--------------------------------------------------------------------------- */
const DATA = /*__ACCESS_MAP_DATA__*/null;
const MAX_EDGES_PER_NODE = __MAX_EDGES_PER_NODE__;

const RIGHTS_LABELS = ['Full Control', 'Modify', 'Read & Execute', 'Read', 'Write', 'Special'];
// Higher = more "interesting" to show first when a node has more neighbors
// than MAX_EDGES_PER_NODE. Explicit (non-inherited) always outweighs rights level.
const RIGHTS_WEIGHT = [100, 90, 50, 10, 60, 85];
const EDGE_COLORS   = ['#ff5d5d', '#ffb454', '#57d3d3', '#7d8a99', '#4da3ff', '#c084fc'];

const TYPE_COLORS = {
  User: '#4da3ff', Group: '#c084fc', Computer: '#7d8a99',
  'Well-known / Local': '#5a6472', Unresolved: '#5a6472'
};

const DORMANT_DAYS = 90;
const TREE_CHILD_CAP = MAX_EDGES_PER_NODE; // max children shown per folder before "+N more"
const TREE_AUTO_EXPAND_CAP = 1500;         // safety cap on total nodes auto-expanded (Full depth), regardless of tree size

let state = {
  tab: 'identities',
  search: '',
  selected: null,      // { kind: 'identity'|'folder', idx: N }
  history: [],
  tableSort: { col: null, dir: 1 },
  tableFilter: '',
  depth: 1             // tree auto-expand depth: 1/2/3/4/5/Infinity ("Full") -- 1 = just the
                        // folder itself, no subfolders shown yet; 2 = + its direct subfolders;
                        // 3 = + their own subfolders in turn; etc. Each subfolder's own children
                        // branch from it specifically -- never pooled with a sibling's.
};

/* ------------------------------- Precompute ------------------------------- */

const byIdentity = new Map();  // idx -> [edgeIdx,...]
const byFolder = new Map();    // idx -> [edgeIdx,...]
const folderPathToIdx = new Map(); // path string -> folder idx
const folderChildren = new Map();  // parentIdx -> [childIdx,...], sorted, built in precompute()
const folderParent = new Map();    // childIdx -> parentIdx

function buildFolderTree() {
  // Parent/child relationships are derived purely from path strings -- a folder
  // is another folder's direct child if its path is exactly one segment longer
  // and starts with the parent's path. This only connects folders that are
  // BOTH actually present in the scanned data (e.g. if the audit didn't walk
  // an intermediate folder, the chain breaks there rather than guessing).
  DATA.folders.forEach((f, idx) => folderPathToIdx.set(f.path, idx));
  DATA.folders.forEach((f, idx) => {
    const segs = f.path.split('\\').filter(Boolean);
    if (segs.length <= 2) return; // \\server\share -- a share root has no parent in our data
    const parentPath = '\\\\' + segs.slice(0, -1).join('\\');
    const parentIdx = folderPathToIdx.get(parentPath);
    if (parentIdx !== undefined) {
      if (!folderChildren.has(parentIdx)) folderChildren.set(parentIdx, []);
      folderChildren.get(parentIdx).push(idx);
      folderParent.set(idx, parentIdx);
    }
  });
  folderChildren.forEach(list => list.sort((a, b) => DATA.folders[a].path.localeCompare(DATA.folders[b].path)));
}

function computeTopmostRoots(candidateIndices) {
  // Given a set of folders an identity has a direct edge to, a normal
  // recursive audit typically records an ACE row for EVERY folder in a
  // branch (inherited ACEs get captured per-folder) -- so without this, a
  // parent folder and several of its own descendants would each show up as
  // their own separate, duplicated top-level tree root. Keep only the
  // topmost folder per branch; everything beneath it is already reachable
  // by expanding that one root.
  const candidateSet = new Set(candidateIndices);
  return candidateIndices.filter(idx => {
    let p = folderParent.get(idx);
    while (p !== undefined) {
      if (candidateSet.has(p)) return false; // an ancestor is also a candidate -- not topmost
      p = folderParent.get(p);
    }
    return true;
  });
}

function precompute() {
  DATA.edges.forEach((e, ei) => {
    const folderIdx = e[0], identityIdx = e[1];
    if (!byIdentity.has(identityIdx)) byIdentity.set(identityIdx, []);
    byIdentity.get(identityIdx).push(ei);
    if (!byFolder.has(folderIdx)) byFolder.set(folderIdx, []);
    byFolder.get(folderIdx).push(ei);
  });

  buildFolderTree();

  // Per-folder broken-inheritance flag (edge index 4), OR'd across its edges.
  DATA.folders.forEach((f, fi) => { f.broken = false; });
  DATA.edges.forEach(e => { if (e[4]) DATA.folders[e[0]].broken = true; });

  // Per-identity disabled/dormant/locked flags, precomputed once.
  const now = new Date();
  DATA.identities.forEach(idn => {
    idn.flagDisabled = (idn.enabled === false);
    idn.flagLocked = (idn.locked === true);
    idn.flagDormant = false;
    if (idn.lastLogon) {
      const d = new Date(idn.lastLogon);
      if (!isNaN(d.getTime())) {
        const days = (now - d) / (1000 * 60 * 60 * 24);
        if (days > DORMANT_DAYS) idn.flagDormant = true;
      }
    }
  });
}

/* --------------------------------- Helpers -------------------------------- */

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtBool(b) { return b === true ? 'Yes' : (b === false ? 'No' : ''); }
function truncateLabel(s, n) { if (!s) return ''; return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }

function downloadCsv(filename, rows, columns) {
  const header = columns.map(c => c.label).join(',');
  const lines = rows.map(r => columns.map(c => {
    let v = c.get(r);
    if (v === null || v === undefined) v = '';
    v = String(v).replace(/"/g, '""');
    return /[",\n]/.test(v) ? '"' + v + '"' : v;
  }).join(','));
  const csv = [header].concat(lines).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------- Sidebar -------------------------------- */

function renderStats() {
  const brokenCount = DATA.folders.filter(f => f.broken).length;
  const dormantCount = DATA.identities.filter(i => i.flagDisabled || i.flagDormant || i.flagLocked).length;
  document.getElementById('statsLine').textContent =
    `${DATA.identities.length} identities \u00b7 ${DATA.folders.length} folders \u00b7 ${DATA.edges.length} access entries \u00b7 ` +
    `${brokenCount} broken-inheritance folder(s) \u00b7 ${dormantCount} disabled/dormant identity(ies)`;
}

function renderList() {
  const panel = document.getElementById('listPanel');
  panel.innerHTML = '';
  const q = state.search.trim().toLowerCase();
  const LIMIT = 300;

  if (state.tab === 'identities') {
    let items = DATA.identities.map((idn, idx) => ({ idn, idx }));
    if (q) items = items.filter(x => (x.idn.name || '').toLowerCase().includes(q) ||
                                      (x.idn.dept || '').toLowerCase().includes(q) ||
                                      (x.idn.title || '').toLowerCase().includes(q));
    const total = items.length;
    items = items.slice(0, LIMIT);
    items.forEach(({ idn, idx }) => {
      const div = document.createElement('div');
      div.className = 'listItem';
      let badges = '';
      if (idn.flagDisabled) badges += '<span class="badge disabled">disabled</span>';
      if (idn.flagLocked) badges += '<span class="badge locked">locked</span>';
      if (idn.flagDormant && !idn.flagDisabled) badges += '<span class="badge dormant">dormant</span>';
      div.innerHTML = `<div>${esc(idn.name || '(unknown)')}${badges}</div><div class="sub">${esc(idn.type || '')}${idn.title ? ' \u00b7 ' + esc(idn.title) : ''}</div>`;
      div.onclick = () => selectIdentity(idx, true);
      panel.appendChild(div);
    });
    if (total > LIMIT) {
      const more = document.createElement('div');
      more.className = 'listMore';
      more.textContent = `${total - LIMIT} more \u2014 refine your search`;
      panel.appendChild(more);
    }
  } else {
    let items = DATA.folders.map((f, idx) => ({ f, idx }));
    if (q) items = items.filter(x => x.f.path.toLowerCase().includes(q));
    const total = items.length;
    items = items.slice(0, LIMIT);
    items.forEach(({ f, idx }) => {
      const div = document.createElement('div');
      div.className = 'listItem';
      const badge = f.broken ? '<span class="badge broken">broken inheritance</span>' : '';
      div.innerHTML = `<div>${esc(truncateLabel(f.path, 60))}${badge}</div>`;
      div.title = f.path;
      div.onclick = () => selectFolder(idx, true);
      panel.appendChild(div);
    });
    if (total > LIMIT) {
      const more = document.createElement('div');
      more.className = 'listMore';
      more.textContent = `${total - LIMIT} more \u2014 refine your search`;
      panel.appendChild(more);
    }
  }
}

function setTab(tab) {
  state.tab = tab;
  document.getElementById('tabIdentities').className = tab === 'identities' ? 'active' : '';
  document.getElementById('tabFolders').className = tab === 'folders' ? 'active' : '';
  renderList();
}

/* ----------------------------- Selection / nav ----------------------------- */

function pushHistory() {
  if (state.selected) state.history.push(state.selected);
  document.getElementById('backBtn').disabled = state.history.length === 0;
}

function goBack() {
  if (state.history.length === 0) return;
  const prev = state.history.pop();
  document.getElementById('backBtn').disabled = state.history.length === 0;
  if (prev.kind === 'identity') renderIdentity(prev.idx); else renderFolder(prev.idx);
  state.selected = prev;
}

function selectIdentity(idx, recordHistory) {
  if (recordHistory) pushHistory();
  state.selected = { kind: 'identity', idx };
  state.tableSort = { col: null, dir: 1 };
  state.tableFilter = '';
  setTab('identities');
  renderIdentity(idx);
}

function selectFolder(idx, recordHistory) {
  if (recordHistory) pushHistory();
  state.selected = { kind: 'folder', idx };
  state.tableSort = { col: null, dir: 1 };
  state.tableFilter = '';
  setTab('folders');
  renderFolder(idx);
}

/* -------------------------------- Folder tree view --------------------------- */

function lastPathSegment(path) {
  const segs = path.split('\\').filter(Boolean);
  return segs.length ? segs[segs.length - 1] : path;
}

function renderFolderNode(folderIdx, level, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget) {
  // Builds one folder row plus a (possibly lazily-built) container for its
  // children. Auto-expands up to maxAutoExpandDepth LEVELS deep (level 1 =
  // this node itself, so maxAutoExpandDepth=1 means "just this folder, no
  // children shown yet"); every subfolder's own children always branch from
  // that subfolder specifically, never pooled with a sibling's. Beyond the
  // auto-expand depth, anything with children can still be expanded manually
  // by clicking its toggle, regardless of the depth setting.
  const f = DATA.folders[folderIdx];
  const wrap = document.createElement('div');
  wrap.className = 'treeNode';

  const row = document.createElement('div');
  row.className = 'treeRow' + (folderIdx === selectedFolderIdx ? ' selected' : '');

  const allChildren = folderChildren.get(folderIdx) || [];
  const hasChildren = allChildren.length > 0;

  const toggle = document.createElement('span');
  toggle.className = 'treeToggle';
  toggle.textContent = '\u00a0\u00a0';
  row.appendChild(toggle);

  const label = document.createElement('span');
  label.className = 'treeLabel';
  label.textContent = lastPathSegment(f.path);
  label.title = f.path;
  row.appendChild(label);

  const edgeCount = (byFolder.get(folderIdx) || []).length;
  const countBadge = document.createElement('span');
  countBadge.className = 'treeCount';
  countBadge.textContent = String(edgeCount);
  countBadge.title = `${edgeCount} access ${edgeCount === 1 ? 'entry' : 'entries'} on this folder`;
  row.appendChild(countBadge);

  if (f.broken) {
    const b = document.createElement('span');
    b.className = 'badge broken';
    b.textContent = 'broken';
    b.title = 'Inheritance is broken here (explicit ACL, not inherited from parent)';
    row.appendChild(b);
  }

  row.onclick = () => onSelectFolder(folderIdx);
  wrap.appendChild(row);

  const childHost = document.createElement('div');
  childHost.className = 'treeChildren';
  wrap.appendChild(childHost);

  let expanded = false;
  let built = false;

  function buildChildren() {
    if (built) return;
    built = true;
    const shown = allChildren.slice(0, TREE_CHILD_CAP);
    shown.forEach(childIdx => {
      childHost.appendChild(renderFolderNode(childIdx, level + 1, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget));
    });
    if (allChildren.length > TREE_CHILD_CAP) {
      const more = document.createElement('div');
      more.className = 'treeMore';
      more.textContent = `+ ${allChildren.length - TREE_CHILD_CAP} more subfolder(s) not shown here -- select this folder to see everything in the table below.`;
      childHost.appendChild(more);
    }
  }

  function setExpanded(v) {
    expanded = v;
    if (expanded) buildChildren();
    childHost.style.display = expanded ? 'block' : 'none';
    if (hasChildren) toggle.textContent = expanded ? '\u25be' : '\u25b8';
  }

  if (hasChildren) {
    toggle.classList.add('hasChildren');
    toggle.onclick = (e) => { e.stopPropagation(); setExpanded(!expanded); };
  }

  const shouldAutoExpand = hasChildren && level < maxAutoExpandDepth && expandBudget.count < TREE_AUTO_EXPAND_CAP;
  if (shouldAutoExpand) expandBudget.count++;
  setExpanded(shouldAutoExpand);

  return wrap;
}

function renderFolderTreeView(rootFolderIndices, onSelectFolder, selectedFolderIdx, onDepthChange) {
  // rootFolderIndices: one root (folder-centered view) or several (identity-
  // centered view -- every folder that identity directly accesses, each
  // getting its own independent tree; nothing here ever reaches OUTSIDE those
  // specific roots' own subfolder structure, so there is no path for an
  // unrelated part of the tree to leak in the way a relationship-hop graph
  // could -- see the depth toolbar's hint text for what depth means here).
  const wrap = document.createElement('div');
  wrap.className = 'treeWrap';

  const toolbar = document.createElement('div');
  toolbar.className = 'treeToolbar';
  const depthLabel = document.createElement('span');
  depthLabel.className = 'groupLabel';
  depthLabel.textContent = 'Depth:';
  toolbar.appendChild(depthLabel);
  [1, 2, 3, 4, 5, 'Full'].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'depthBtn' + ((d === 'Full' ? Infinity : d) === state.depth ? ' active' : '');
    btn.textContent = String(d);
    btn.onclick = () => { state.depth = (d === 'Full' ? Infinity : d); onDepthChange(); };
    toolbar.appendChild(btn);
  });
  const hint = document.createElement('span');
  hint.className = 'groupLabel';
  hint.textContent = 'Depth = how many levels of subfolders to auto-expand \u00b7 each subfolder\'s own children branch from it, not a shared pool \u00b7 click the \u25b8 to expand/collapse manually \u00b7 click a folder name to select it';
  toolbar.appendChild(hint);
  wrap.appendChild(toolbar);

  const maxAutoExpandDepth = state.depth === Infinity ? Infinity : state.depth;
  const expandBudget = { count: 0 };
  const treeHost = document.createElement('div');
  treeHost.className = 'treeHost';
  rootFolderIndices.forEach(rootIdx => {
    treeHost.appendChild(renderFolderNode(rootIdx, 1, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget));
  });
  wrap.appendChild(treeHost);

  if (expandBudget.count >= TREE_AUTO_EXPAND_CAP) {
    const note = document.createElement('div');
    note.className = 'treeNote';
    note.textContent = `This tree is large -- auto-expansion stopped after ${TREE_AUTO_EXPAND_CAP} folders to stay responsive. Anything still collapsed can be expanded manually by clicking its \u25b8, or reduce depth.`;
    wrap.appendChild(note);
  }

  return wrap;
}

function renderTable(rows, columns, opts) {
  // columns: [{ key, label, get(row), sortable }]
  // The filter <input> (and the table/toolbar shells) are created exactly ONCE
  // here and never torn down again for the lifetime of this table -- typing a
  // character calls update() below, which only touches the header cells, the
  // tbody rows, and the export button's row count. Rebuilding the whole
  // container (including the input itself) on every keystroke was the earlier
  // approach, and it silently stole focus after each character since the
  // browser can't keep focus on an element that no longer exists.
  const container = document.createElement('div');

  const toolbar = document.createElement('div');
  toolbar.className = 'tableToolbar';
  const filterInput = document.createElement('input');
  filterInput.placeholder = 'Filter this table...';
  filterInput.value = state.tableFilter;
  toolbar.appendChild(filterInput);
  const exportBtn = document.createElement('button');
  toolbar.appendChild(exportBtn);
  container.appendChild(toolbar);

  const table = document.createElement('table');
  table.className = 'datatable';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  container.appendChild(table);

  const note = document.createElement('div');
  note.className = 'graphNote';
  container.appendChild(note);

  function computeFilteredSorted() {
    let filtered = rows;
    const q = state.tableFilter.trim().toLowerCase();
    if (q) {
      filtered = rows.filter(r => columns.some(c => String(c.get(r) || '').toLowerCase().includes(q)));
    }
    if (state.tableSort.col) {
      const col = columns.find(c => c.key === state.tableSort.col);
      if (col) {
        filtered = filtered.slice().sort((a, b) => {
          const va = col.get(a), vb = col.get(b);
          if (va < vb) return -1 * state.tableSort.dir;
          if (va > vb) return 1 * state.tableSort.dir;
          return 0;
        });
      }
    }
    return filtered;
  }

  const RENDER_LIMIT = 2000;

  function update() {
    const filtered = computeFilteredSorted();

    trh.innerHTML = '';
    columns.forEach(c => {
      const th = document.createElement('th');
      let arrow = '';
      if (state.tableSort.col === c.key) arrow = state.tableSort.dir === 1 ? ' \u25b2' : ' \u25bc';
      th.textContent = c.label + arrow;
      th.onclick = () => {
        if (state.tableSort.col === c.key) state.tableSort.dir *= -1;
        else state.tableSort = { col: c.key, dir: 1 };
        update();
      };
      trh.appendChild(th);
    });

    tbody.innerHTML = '';
    filtered.slice(0, RENDER_LIMIT).forEach(r => {
      const tr = document.createElement('tr');
      if (opts.onRowClick) { tr.className = 'rowclick'; tr.onclick = () => opts.onRowClick(r); }
      columns.forEach(c => {
        const td = document.createElement('td');
        if (c.html) td.innerHTML = c.html(r); else td.textContent = c.get(r);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    exportBtn.textContent = `Export ${filtered.length} row(s) as CSV`;
    exportBtn.onclick = () => downloadCsv(opts.filename, filtered, columns.map(c => ({ label: c.label, get: c.get })));

    note.textContent = filtered.length > RENDER_LIMIT
      ? `Showing first ${RENDER_LIMIT} of ${filtered.length} filtered rows. Narrow the filter, or use Export to get all of them.`
      : '';
  }

  filterInput.oninput = (e) => { state.tableFilter = e.target.value; update(); };

  update();
  return container;
}

/* ------------------------------- Identity view ------------------------------ */

function identityInfoCard(idn) {
  const div = document.createElement('div');
  div.className = 'card';
  const flags = [];
  if (idn.flagDisabled) flags.push('<span class="badge disabled">Disabled</span>');
  if (idn.flagLocked) flags.push('<span class="badge locked">Locked out</span>');
  if (idn.flagDormant) flags.push('<span class="badge dormant">No logon in ' + DORMANT_DAYS + '+ days</span>');
  const field = (label, val) => val ? `<span class="field"><b>${esc(label)}:</b> ${esc(val)}</span>` : '';
  div.innerHTML =
    `<h2>${esc(idn.name || '(unknown)')} <span style="font-weight:400;color:var(--muted);font-size:12px;">${esc(idn.type||'')}</span> ${flags.join(' ')}</h2>` +
    field('Title', idn.title) + field('Department', idn.dept) + field('Manager', idn.manager) +
    field('Email', idn.email) + field('Last logon (approx.)', idn.lastLogon) +
    field('Last modified (AD)', idn.changed) + field('Password last set', idn.pwdSet) +
    field('Account expires', idn.expires) + field('Created', idn.created) +
    field('Group scope', idn.groupScope) + field('Direct member count', idn.memberCount) + field('Managed by', idn.managedBy) +
    field('Notes', idn.notes) + field('SID', idn.sid);
  return div;
}

function renderIdentity(idx) {
  const idn = DATA.identities[idx];
  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(identityInfoCard(idn));

  const edgeIdxs = byIdentity.get(idx) || [];
  const allRows = edgeIdxs.map(ei => ({ ei, e: DATA.edges[ei] }));

  // Every distinct folder this identity directly accesses becomes its OWN tree
  // root -- each expands into its own subfolder structure independently, with
  // no relationship-hop traversal through other identities/groups at all, so
  // there's no way for something outside this identity's own access to appear.
  // computeTopmostRoots collapses a folder-and-several-of-its-own-descendants
  // (common with inherited ACEs recorded per-folder) down to just the topmost
  // one per branch, so a subfolder never shows up as a duplicate second root.
  const allAccessedFolders = Array.from(new Set(allRows.map(r => r.e[0])));
  const rootFolderIndices = computeTopmostRoots(allAccessedFolders)
    .sort((a, b) => DATA.folders[a].path.localeCompare(DATA.folders[b].path));

  content.appendChild(renderFolderTreeView(
    rootFolderIndices,
    (folderIdx) => selectFolder(folderIdx, true),
    null, // no single "selected" folder highlight makes sense from an identity view with multiple roots
    () => renderIdentity(idx)
  ));

  const columns = [
    { key: 'path', label: 'Path', get: r => DATA.folders[r.e[0]].path },
    { key: 'rights', label: 'Rights', get: r => RIGHTS_LABELS[r.e[2]] },
    { key: 'inherited', label: 'Inherited', get: r => r.e[3] ? 'Yes' : 'No' },
    { key: 'broken', label: 'Broken inheritance here', get: r => r.e[4] ? 'Yes' : 'No' },
    { key: 'deny', label: 'Deny', get: r => r.e[5] ? 'Yes' : 'No' },
    { key: 'via', label: 'Granted via group', get: r => r.e[6] >= 0 ? DATA.identities[r.e[6]].name : '' }
  ];
  const tableHost = document.createElement('div');
  tableHost.appendChild(renderTable(allRows, columns, {
    filename: `access_${(idn.name||'identity').replace(/[^a-z0-9]+/gi,'_')}.csv`,
    onRowClick: (r) => selectFolder(r.e[0], true)
  }));
  content.appendChild(tableHost);
}

/* -------------------------------- Folder view -------------------------------- */

function folderInfoCard(f) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<h2>${esc(f.path)} ${f.broken ? '<span class="badge broken">Inheritance broken here</span>' : ''}</h2>`;
  return div;
}

function renderFolder(idx) {
  const f = DATA.folders[idx];
  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(folderInfoCard(f));

  content.appendChild(renderFolderTreeView(
    [idx],
    (folderIdx) => selectFolder(folderIdx, true),
    idx,
    () => renderFolder(idx)
  ));

  const edgeIdxs = byFolder.get(idx) || [];
  const allRows = edgeIdxs.map(ei => ({ ei, e: DATA.edges[ei] }));

  const columns = [
    { key: 'name', label: 'Identity', get: r => DATA.identities[r.e[1]].name },
    { key: 'type', label: 'Type', get: r => DATA.identities[r.e[1]].type },
    { key: 'rights', label: 'Rights', get: r => RIGHTS_LABELS[r.e[2]] },
    { key: 'inherited', label: 'Inherited', get: r => r.e[3] ? 'Yes' : 'No' },
    { key: 'deny', label: 'Deny', get: r => r.e[5] ? 'Yes' : 'No' },
    { key: 'via', label: 'Granted via group', get: r => r.e[6] >= 0 ? DATA.identities[r.e[6]].name : '' },
    { key: 'enabled', label: 'Enabled', get: r => fmtBool(DATA.identities[r.e[1]].enabled) }
  ];
  const tableHost = document.createElement('div');
  tableHost.appendChild(renderTable(allRows, columns, {
    filename: `access_${f.path.replace(/[^a-z0-9]+/gi,'_')}.csv`,
    onRowClick: (r) => selectIdentity(r.e[1], true)
  }));
  content.appendChild(tableHost);
}

/* -------------------------------- Quick filters ------------------------------ */

function showWelcome() {
  const content = document.getElementById('content');
  const brokenCount = DATA.folders.filter(f => f.broken).length;
  const dormantCount = DATA.identities.filter(i => i.flagDisabled || i.flagDormant || i.flagLocked).length;
  content.innerHTML = `<div id="welcome">
    <p>Select an identity or folder on the left to see its access map, or use the quick filters above.</p>
    <ul>
      <li><b>${brokenCount}</b> folder(s) have broken inheritance (their own explicit ACL, not inherited from the parent).</li>
      <li><b>${dormantCount}</b> identity(ies) are disabled, locked out, or have had no logon in ${DORMANT_DAYS}+ days.</li>
    </ul>
    <p>Click a node in a graph to jump to it; use Back to return to where you were.</p>
  </div>`;
}

function filterToBrokenFolders() {
  setTab('folders');
  document.getElementById('searchBox').value = '';
  state.search = '';
  const panel = document.getElementById('listPanel');
  panel.innerHTML = '';
  const items = DATA.folders.map((f, idx) => ({ f, idx })).filter(x => x.f.broken);
  items.forEach(({ f, idx }) => {
    const div = document.createElement('div');
    div.className = 'listItem';
    div.innerHTML = `<div>${esc(truncateLabel(f.path, 60))}<span class="badge broken">broken inheritance</span></div>`;
    div.title = f.path;
    div.onclick = () => selectFolder(idx, true);
    panel.appendChild(div);
  });
  if (items.length === 0) {
    const none = document.createElement('div');
    none.className = 'listMore';
    none.textContent = 'None found.';
    panel.appendChild(none);
  }
}

function filterToDormantIdentities() {
  setTab('identities');
  document.getElementById('searchBox').value = '';
  state.search = '';
  const panel = document.getElementById('listPanel');
  panel.innerHTML = '';
  const items = DATA.identities.map((idn, idx) => ({ idn, idx })).filter(x => x.idn.flagDisabled || x.idn.flagDormant || x.idn.flagLocked);
  items.forEach(({ idn, idx }) => {
    const div = document.createElement('div');
    div.className = 'listItem';
    let badges = '';
    if (idn.flagDisabled) badges += '<span class="badge disabled">disabled</span>';
    if (idn.flagLocked) badges += '<span class="badge locked">locked</span>';
    if (idn.flagDormant && !idn.flagDisabled) badges += '<span class="badge dormant">dormant</span>';
    div.innerHTML = `<div>${esc(idn.name || '(unknown)')}${badges}</div><div class="sub">${esc(idn.type||'')}${idn.title ? ' \u00b7 ' + esc(idn.title) : ''}</div>`;
    div.onclick = () => selectIdentity(idx, true);
    panel.appendChild(div);
  });
  if (items.length === 0) {
    const none = document.createElement('div');
    none.className = 'listMore';
    none.textContent = 'None found.';
    panel.appendChild(none);
  }
}

/* ----------------------------------- Init ------------------------------------ */

function init() {
  precompute();
  renderStats();
  showWelcome();
  renderList();

  document.getElementById('tabIdentities').onclick = () => setTab('identities');
  document.getElementById('tabFolders').onclick = () => setTab('folders');
  document.getElementById('searchBox').oninput = (e) => { state.search = e.target.value; renderList(); };
  document.getElementById('backBtn').onclick = goBack;
  document.getElementById('btnBroken').onclick = filterToBrokenFolders;
  document.getElementById('btnDormant').onclick = filterToDormantIdentities;

  document.getElementById('footerLine').textContent =
    `Generated ${DATA.generatedAt} from ${DATA.sourceFolder} (toolkit v${DATA.toolkitVersion || '?'}) \u2014 point-in-time snapshot, not live data.`;
}

init();
</script>
