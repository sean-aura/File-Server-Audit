function folderInfoCard(f) {
  const div = document.createElement('div');
  div.className = 'card';

  // A clickable breadcrumb instead of a flat path string, so a deeply nested
  // folder can jump straight back to any ancestor without going through the
  // sidebar or the tree -- each segment navigates to that exact folder if
  // it's one the scan actually recorded (a virtual, "not scanned" ancestor
  // -- see ensureNode -- has nothing to navigate to, so it's shown plain).
  const crumbWrap = document.createElement('div');
  crumbWrap.className = 'breadcrumb';
  const segs = f.path.split('\\').filter(Boolean);
  let acc = '';
  segs.forEach((seg, i) => {
    const isLast = i === segs.length - 1;
    acc = i === 0 ? seg : (acc + '\\' + seg);

    const span = document.createElement('span');
    span.textContent = seg;
    if (i === 0) {
      // The server name alone (\\server, no share) was never a node in our
      // data to begin with -- nothing to navigate to.
      span.className = 'crumbPlain';
    } else if (isLast) {
      span.className = 'crumbCurrent';
    } else {
      const nodeId = folderPathToIdx.get('\\\\' + acc);
      if (nodeId !== undefined && nodeIsReal(nodeId)) {
        span.className = 'crumbLink';
        span.onclick = () => selectFolder(nodeId, true);
      } else {
        span.className = 'crumbPlain';
      }
    }
    crumbWrap.appendChild(span);
    if (!isLast) {
      const sep = document.createElement('span');
      sep.className = 'crumbSep';
      sep.textContent = '\u203a';
      crumbWrap.appendChild(sep);
    }
  });
  div.appendChild(crumbWrap);

  if (f.broken) {
    const badge = document.createElement('span');
    badge.className = 'badge broken';
    badge.textContent = 'Inheritance broken here';
    div.appendChild(badge);
  }
  return div;
}

function buildFolderAclGroups(folderIdx) {
  // Splits a folder's access entries into direct rows (e[6] === -1: an
  // ordinary direct grant, OR a group's own listing) and via-group rows
  // (e[6] >= 0: a member shown here only because of that group's grant).
  // A direct row for a Group identity absorbs its own via-group rows as
  // nested children instead of leaving them as separate top-level rows --
  // that flattening (group AND every member listed side by side) is what
  // made a single group grant look like several additional, separately-
  // counted identities with access.
  const edgeIdxs = byFolder.get(folderIdx) || [];
  const byVia = new Map(); // groupIdx -> [ei,...], consumed as each group's row is built
  const directEis = [];
  edgeIdxs.forEach(ei => {
    const via = DATA.edges[ei][6];
    if (via >= 0) {
      if (!byVia.has(via)) byVia.set(via, []);
      byVia.get(via).push(ei);
    } else {
      directEis.push(ei);
    }
  });
  const rows = [];
  directEis.forEach(ei => {
    const e = DATA.edges[ei];
    const identIdx = e[1];
    const idn = DATA.identities[identIdx];
    let children = null;
    if (idn.type === 'Group' && byVia.has(identIdx)) {
      children = byVia.get(identIdx).map(cei => ({ ei: cei, e: DATA.edges[cei] }));
      byVia.delete(identIdx);
    }
    rows.push({ ei, e, children });
  });
  // Any leftover via-group rows whose granting group has no direct row of
  // its own recorded on this exact folder still need to be shown -- surfaced
  // as their own top-level rows (tagged "via <group>") rather than dropped.
  byVia.forEach(eis => eis.forEach(cei => rows.push({ ei: cei, e: DATA.edges[cei], children: null })));
  return rows;
}

function aclRowMatches(row, q) {
  if (!q) return true;
  const hay = (r) => {
    const e = r.e, idn = DATA.identities[e[1]];
    return [idn.name, idn.type, RIGHTS_LABELS[e[2]]].join(' ').toLowerCase();
  };
  if (hay(row).includes(q)) return true;
  return !!(row.children && row.children.some(c => hay(c).includes(q)));
}

function renderAclRow(row, onIdentityClick, isChild) {
  const e = row.e;
  const idn = DATA.identities[e[1]];
  const div = document.createElement('div');
  div.className = 'aclRow';

  const toggle = document.createElement('span');
  toggle.className = 'treeToggle';
  toggle.textContent = '\u00a0\u00a0';
  div.appendChild(toggle);

  const name = document.createElement('span');
  name.className = 'aclName';
  name.textContent = idn.name || '(unknown)';
  name.title = idn.name || '';
  div.appendChild(name);

  const type = document.createElement('span');
  type.className = 'aclType';
  type.textContent = idn.type || '';
  div.appendChild(type);

  const rights = document.createElement('span');
  rights.className = 'pill ' + (e[5] ? 'deny' : (e[3] ? 'inherited' : 'explicit'));
  rights.textContent = RIGHTS_LABELS[e[2]] + (e[5] ? ' (Deny)' : '');
  div.appendChild(rights);

  if (isChild) {
    const tag = document.createElement('span');
    tag.className = 'aclViaNote';
    tag.textContent = 'member';
    div.appendChild(tag);
  } else if (e[6] >= 0) {
    // An orphaned via-group row: its granting group has no direct row of its
    // own on this exact folder, so it's shown flat with a "via" tag instead
    // of nested (there's no parent row here to nest it under).
    const tag = document.createElement('span');
    tag.className = 'aclViaNote';
    tag.textContent = 'via ' + (DATA.identities[e[6]].name || '?');
    div.appendChild(tag);
  }

  div.onclick = () => onIdentityClick(e[1]);

  const wrap = document.createElement('div');
  wrap.appendChild(div);

  if (row.children && row.children.length) {
    const childHost = document.createElement('div');
    childHost.className = 'aclChildren';
    childHost.style.display = 'none';
    row.children.forEach(c => childHost.appendChild(renderAclRow(c, onIdentityClick, true)));
    wrap.appendChild(childHost);
    toggle.classList.add('hasChildren');
    toggle.textContent = '\u25b8';
    let expanded = false;
    const setExpanded = (v) => {
      expanded = v;
      childHost.style.display = expanded ? 'block' : 'none';
      toggle.textContent = expanded ? '\u25be' : '\u25b8';
    };
    toggle.onclick = (ev) => { ev.stopPropagation(); setExpanded(!expanded); };
    wrap._setExpanded = setExpanded; // used below to auto-expand a group whose members matched a filter
  }
  return wrap;
}

function renderFolderAclList(folderIdx, onIdentityClick) {
  const rows = buildFolderAclGroups(folderIdx);
  const counts = folderAccessCounts(folderIdx);
  const allFlatForExport = (byFolder.get(folderIdx) || []).map(ei => ({ ei, e: DATA.edges[ei] }));

  const wrap = document.createElement('div');
  wrap.className = 'aclWrap';

  const summary = document.createElement('div');
  summary.className = 'aclSummary';
  summary.textContent = counts.viaGroup > 0
    ? `${counts.direct} direct grant${counts.direct === 1 ? '' : 's'} \u00b7 ${counts.viaGroup} more identit${counts.viaGroup === 1 ? 'y' : 'ies'} via group membership (expand a group below to see its members)`
    : `${counts.direct} direct grant${counts.direct === 1 ? '' : 's'}`;
  wrap.appendChild(summary);

  const toolbar = document.createElement('div');
  toolbar.className = 'aclToolbar';
  const filterInput = document.createElement('input');
  filterInput.placeholder = 'Filter this list...';
  toolbar.appendChild(filterInput);
  const exportBtn = document.createElement('button');
  exportBtn.textContent = `Export ${allFlatForExport.length} row(s) as CSV`;
  exportBtn.onclick = () => downloadCsv(
    `access_${DATA.folders[folderIdx].path.replace(/[^a-z0-9]+/gi, '_')}.csv`,
    allFlatForExport,
    [
      { label: 'Identity', get: r => DATA.identities[r.e[1]].name },
      { label: 'Type', get: r => DATA.identities[r.e[1]].type },
      { label: 'Rights', get: r => RIGHTS_LABELS[r.e[2]] },
      { label: 'Inherited', get: r => r.e[3] ? 'Yes' : 'No' },
      { label: 'Deny', get: r => r.e[5] ? 'Yes' : 'No' },
      { label: 'Granted via group', get: r => r.e[6] >= 0 ? DATA.identities[r.e[6]].name : '' },
      { label: 'Enabled', get: r => fmtBool(DATA.identities[r.e[1]].enabled) }
    ]
  );
  toolbar.appendChild(exportBtn);
  wrap.appendChild(toolbar);

  const host = document.createElement('div');
  host.className = 'aclHost';
  wrap.appendChild(host);

  function rebuild() {
    host.innerHTML = '';
    const q = filterInput.value.trim().toLowerCase();
    const visible = rows.filter(r => aclRowMatches(r, q));
    visible.forEach(r => {
      const node = renderAclRow(r, onIdentityClick, false);
      host.appendChild(node);
      if (q && node._setExpanded) {
        const idn = DATA.identities[r.e[1]];
        const parentMatches = [idn.name, idn.type, RIGHTS_LABELS[r.e[2]]].join(' ').toLowerCase().includes(q);
        if (!parentMatches) node._setExpanded(true); // the match was in a member, not the group itself -- expand so it's visible
      }
    });
    if (visible.length === 0) {
      const none = document.createElement('div');
      none.className = 'graphNote';
      none.textContent = 'No matches.';
      host.appendChild(none);
    }
  }
  filterInput.oninput = rebuild;
  rebuild();

  return wrap;
}

function renderFolder(idx) {
  const f = DATA.folders[idx];
  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(folderInfoCard(f));

  content.appendChild(renderDetailTabs(() => renderFolder(idx)));

  if (state.detailTab === 'graph') {

    content.appendChild(renderFolderTreeView(

      () => renderFolder(idx)
    ));

  content.appendChild(renderFolderAclList(idx, (identIdx) => selectIdentity(identIdx, true)));
}

const IDENTITY_TYPE_ORDER = ['User', 'Group', 'Computer', 'Well-known / Local', 'Unresolved'];
const IDENTITY_TYPE_COLORS = { User: '#4da3ff', Group: '#c084fc', Computer: '#7d8a99', 'Well-known / Local': '#5a6472', Unresolved: '#ff5d5d' };

function computeIdentityBreakdown() {
  const byType = {};
  DATA.identities.forEach(idn => { byType[idn.type] = (byType[idn.type] || 0) + 1; });
  return byType;
}

function computeUserHealth() {
  let total = 0, enabled = 0, disabled = 0, locked = 0, dormant = 0;
  DATA.identities.forEach(idn => {
    if (idn.type !== 'User') return;
    total++;
    if (idn.enabled === false) disabled++;
    else if (idn.enabled === true) enabled++;
    if (idn.locked === true) locked++;
    if (idn.flagDormant) dormant++;
  });
  return { total, enabled, disabled, locked, dormant };
}

// These three feed the dashboard, which has to render correctly with ZERO
// share chunks loaded (that's the whole point -- opening the report and
// seeing the summary shouldn't cost a multi-gigabyte parse). Each one used
// to get its answer by scanning every edge; now that edges only exist for
// shares someone has actually drilled into, that same scan would silently
// under-report on an untouched dataset. Build-AccessMapHtml.ps1 already
// visits every edge once while it builds them, so these are precomputed
// there instead and just read back here.

function computeRightsDistribution() {
  return (ACCESS_MAP_MANIFEST.rightsDistribution || [0, 0, 0, 0, 0, 0]).slice();
}

function computeBroadPrincipalGrants() {
  const b = ACCESS_MAP_MANIFEST.broadPrincipalGrants || { folderCount: 0, folderIdxs: [] };
  return { folderCount: b.folderCount, folderIdxs: b.folderIdxs || [] };
}

function computeStaleAccessCounts() {
  let dormantWithAccess = 0, unresolvedWithAccess = 0;
  DATA.identities.forEach(idn => {
    if (!(idn.edgeCount > 0)) return; // precomputed total across ALL shares, not just loaded ones
    if (idn.flagDisabled || idn.flagDormant || idn.flagLocked) dormantWithAccess++;
    if (idn.type === 'Unresolved') unresolvedWithAccess++;
  });
  return { dormantWithAccess, unresolvedWithAccess };
}

function renderDonutChart(segments, size) {
  size = size || 200;
  const R = size / 2 - 28, strokeW = 24, cx = size / 2, cy = size / 2;
  const realTotal = segments.reduce((s, x) => s + x.count, 0);
  const total = realTotal || 1; // safe denominator only -- never used for display
  const C = 2 * Math.PI * R;
  let offset = 0;
  const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size}`, width: size, height: size });
  svg.appendChild(svgEl('circle', { cx, cy, r: R, fill: 'none', stroke: '#20262f', 'stroke-width': strokeW }));
  segments.forEach(seg => {
    if (seg.count <= 0) return;
    const frac = seg.count / total;
    const dash = Math.max(frac * C - (segments.length > 1 ? 1.5 : 0), 0);
    const circle = svgEl('circle', {
      cx, cy, r: R, fill: 'none', stroke: seg.color, 'stroke-width': strokeW,
      'stroke-dasharray': `${dash} ${C - dash}`, 'stroke-dashoffset': -offset,
      transform: `rotate(-90 ${cx} ${cy})`
    });
    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = `${seg.label}: ${seg.count} (${(frac * 100).toFixed(1)}%)`;
    circle.appendChild(title);
    svg.appendChild(circle);
    offset += frac * C;
  });
  const centerText = svgEl('text', { x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 15, fill: '#e6e9ee' });
  centerText.textContent = String(realTotal);
  svg.appendChild(centerText);
  return svg;
}

function renderChartWithLegend(segments) {
  const row = document.createElement('div');
  row.className = 'chartRow';
  row.appendChild(renderDonutChart(segments));
  const legend = document.createElement('div');
  legend.className = 'chartLegend';
  const total = segments.reduce((s, x) => s + x.count, 0) || 1;
  segments.forEach(seg => {
    const r = document.createElement('div');
    r.className = 'legendRow';
    const sw = document.createElement('span');
    sw.className = 'legendSwatch';
    sw.style.background = seg.color;
    r.appendChild(sw);
    const label = document.createElement('span');
    label.textContent = `${seg.label}: ${seg.count} (${((seg.count / total) * 100).toFixed(1)}%)`;
    r.appendChild(label);
    legend.appendChild(r);
  });
  row.appendChild(legend);
  return row;
}

function statCard(num, label, opts) {

function computeObservations() {
  const broad = computeBroadPrincipalGrants();
  const stale = computeStaleAccessCounts();
  const brokenCount = DATA.folders.filter(f => f.broken).length;
  const rights = computeRightsDistribution();
  const totalEdges = rights.reduce((a, b) => a + b, 0) || 1;
  const fullControlShare = rights[0] / totalEdges;
  const scanErrorCount = (DATA.scanErrors || []).length;

  const observations = [];

  // Reused guidance blocks: several observations here are really the same
  // underlying "least privilege" / "stale accounts" issues, so the same
  // sourced control language applies to more than one of them.
  const LEAST_PRIVILEGE_GUIDANCE = [
    { region: 'AU', source: 'ACSC Essential Eight -- Restrict Administrative Privileges (Maturity Level 1)', text: 'Requests for privileged access to systems and applications are validated when first requested, and privileges are assigned on the principle of least privilege.' },
    { region: 'AU', source: 'Australian Government ISM -- Cybersecurity Principle PRO-12 (Least privilege access)', text: 'Grant users the least amount of access necessary to complete their job functions.' },
    { region: 'NZ', source: 'NZISM control 16.4.38.C.01', text: 'Agencies MUST apply the Principle of Least Privilege when developing and implementing a Privileged Access Management policy.' },
    { region: 'US', source: 'NIST SP 800-53 AC-6 (Least Privilege)', text: 'Employ the principle of least privilege, allowing only authorized accesses for users that are necessary to accomplish assigned organizational tasks.' },
    { region: 'US', source: 'NIST CSF 2.0 -- PR.AA-05', text: 'Access permissions and authorizations are managed, incorporating the principles of least privilege and separation of duties.' },
    { region: 'Intl', source: 'CIS Controls v8 -- Safeguard 3.3 (Configure Data Access Control Lists)', text: "Configure data access control lists based on a user's need to know. Apply data access control lists, also known as access permissions, to local and remote file systems." }
  ];
  const STALE_ACCOUNT_GUIDANCE = [
    { region: 'US', source: 'NIST SP 800-53 AC-2(3) (Disable Accounts)', text: 'Disable accounts when they have expired, are no longer associated with a user or individual, are in violation of organizational policy, or have been inactive for an organization-defined period.' },
    { region: 'Intl', source: 'CIS Controls v8 -- Safeguard 5.3 (Disable Dormant Accounts)', text: 'Delete or disable any dormant accounts after a defined period of inactivity.' },
    { region: 'AU', source: 'ACSC Essential Eight -- Restrict Administrative Privileges (Maturity Level 2)', text: 'Privileged access to systems and applications is automatically disabled after 12 months unless revalidated.' },
    { region: 'NZ', source: 'NZISM control 9.2.17.C.02', text: 'Where an agency grants limited higher access, it MUST be temporary and an exception rather than the norm, with a cessation date set.' }
  ];

  if (broad.folderCount > 0) {
    observations.push({
      title: `${broad.folderCount} folder(s) grant Full Control or Modify to a broad, default group (Everyone, Authenticated Users, Domain Users, or Users)`,
      why: 'Broad, generic principals with high-privilege access make it hard to know exactly who can read, change, or delete data, and are a common way ransomware or a single compromised account can spread impact across many folders at once. The frameworks below don\u2019t mention "Everyone" by name, but a broad default group holding Full Control or Modify is close to the opposite of what "least privilege" or "need to know" require.',
      guidance: LEAST_PRIVILEGE_GUIDANCE,
      action: () => filterToBroadGrantFolders()
    });
  }
  if (brokenCount > 0) {
    observations.push({
      title: `${brokenCount} folder(s) have broken inheritance (an explicit ACL that no longer follows the parent)`,
      why: 'Ad-hoc, per-folder permission changes are harder to review consistently and more prone to drift from the intended access model over time. None of the frameworks checked here have a specific rule about NTFS inheritance -- this is a more general configuration-management/consistency concern than a directly-legislated control, so treat it as a "worth a look" flag rather than a named violation.',
      guidance: [
        { region: 'Intl', source: 'CIS Controls v8 -- Safeguard 3.3 (Configure Data Access Control Lists)', text: 'The same access-control-list safeguard applies here: an ACL that silently diverges from the folder above it is harder to configure and audit consistently.' }
      ],
      action: () => filterToBrokenFolders()
    });
  }
  if (stale.dormantWithAccess > 0) {
    observations.push({
      title: `${stale.dormantWithAccess} disabled, locked, or dormant (90+ day) identity(ies) still have active access grants`,
      why: 'Stale accounts that still hold access are attack surface with no legitimate current user behind them -- a common target for re-activation or credential misuse.',
      guidance: STALE_ACCOUNT_GUIDANCE,
      action: () => filterToDormantIdentities()
    });
  }
  if (stale.unresolvedWithAccess > 0) {
    observations.push({
      title: `${stale.unresolvedWithAccess} unresolved SID(s) (likely deleted accounts) still have active access grants`,
      why: 'An orphaned SID on an ACL means the account it once represented no longer exists in AD, but the permission entry was never cleaned up -- pure hygiene debt with no offsetting benefit. This is close to a textbook case of the "no longer associated with a user" condition below.',
      guidance: [
        { region: 'US', source: 'NIST SP 800-53 AC-2(3) (Disable Accounts)', text: 'Disable accounts... that are no longer associated with a user or individual.' },
        { region: 'Intl', source: 'CIS Controls v8 -- Safeguard 5.3 (Disable Dormant Accounts)', text: 'Delete or disable any dormant accounts after a defined period of inactivity.' }
      ]
    });
  }
  if (scanErrorCount > 0) {
    observations.push({
      title: `${scanErrorCount} object(s) could not be scanned at all (access denied or a path/platform limitation)`,
      why: "You can't audit what you can't see. These are blind spots in this report -- worth checking whether the scanning account should have access, and if not, why not, and what's actually stored in the folders you can't see into. This is a general asset-visibility concern rather than a specific access-control rule.",
      guidance: [
        { region: 'Intl', source: 'CIS Controls v8 -- Safeguard 1.1 (Establish and Maintain Detailed Enterprise Asset Inventory)', text: 'You cannot protect (or audit) assets you do not know exist or cannot see into.' },
        { region: 'US', source: 'NIST CSF 2.0 -- ID.AM (Asset Management)', text: 'Assets are inventoried and managed consistent with their relative importance to organizational objectives.' }
      ],
      action: () => showScanErrorsDetail()
    });
  }
  if (fullControlShare > 0.25 && totalEdges >= 20) {
    observations.push({
      title: `${(fullControlShare * 100).toFixed(0)}% of all access grants are Full Control`,
      why: 'Full Control allows changing permissions and taking ownership, not just reading/writing data -- it\'s rarely needed by more than a small set of administrators or data owners. A high share suggests broad over-provisioning rather than least-privilege access.',
      guidance: LEAST_PRIVILEGE_GUIDANCE
    });
  }

  return observations;
}


function filterToBroadGrantFolders() {
  setTab('folders');
  document.getElementById('searchBox').value = '';
  state.search = '';
  const panel = document.getElementById('listPanel');
  panel.innerHTML = '';
  const broad = computeBroadPrincipalGrants();
  const folderIdxs = broad.folderIdxs;
  folderIdxs.forEach(idx => {
    const f = DATA.folders[idx];
    const div = document.createElement('div');
    div.className = 'listItem';
    div.innerHTML = `<div>${esc(truncateLabel(f.path, 60))}</div>`;
    div.title = f.path;
    div.onclick = () => selectFolder(idx, true);
    panel.appendChild(div);
  });
  if (folderIdxs.length === 0) {
    const none = document.createElement('div');
    none.className = 'listMore';
    none.textContent = 'None found.';
    panel.appendChild(none);
  }
}

function showScanErrorsDetail() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'summarySection';
  const title = document.createElement('h2');
  title.textContent = `Objects that could not be scanned (${(DATA.scanErrors || []).length})`;
  card.appendChild(title);

  const errors = DATA.scanErrors || [];
  const table = document.createElement('table');
  table.className = 'scanErrorsTable';
  table.innerHTML = '<thead><tr><th>Path</th><th>Category</th><th>Message</th></tr></thead>';
  const tbody = document.createElement('tbody');
  errors.forEach(err => {
    const tr = document.createElement('tr');
    const tdPath = document.createElement('td');
    tdPath.textContent = err.Path || '(unparsed log line)';
    tdPath.title = err.Path || '';
    const tdCat = document.createElement('td');
    tdCat.textContent = err.Category || '';
    const tdMsg = document.createElement('td');
    tdMsg.textContent = err.Message || '';
    tr.appendChild(tdPath); tr.appendChild(tdCat); tr.appendChild(tdMsg);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.appendChild(table);

  const exportBtn = document.createElement('button');
  exportBtn.textContent = `Export ${errors.length} row(s) as CSV`;
  exportBtn.style.marginTop = '10px';
  exportBtn.onclick = () => downloadCsv('scan_errors.csv', errors, [
    { label: 'Path', get: r => r.Path },
    { label: 'Category', get: r => r.Category },
    { label: 'Message', get: r => r.Message },
    { label: 'Timestamp', get: r => r.Timestamp }
  ]);
  card.appendChild(exportBtn);

  const backLink = document.createElement('button');
  backLink.textContent = '\u2190 Back to Summary';
  backLink.style.marginTop = '10px';
  backLink.style.marginLeft = '8px';
  backLink.onclick = () => renderSummaryView();
  card.appendChild(backLink);

  content.appendChild(card);
}

const ABUSE_REFERENCE = [
  { level: 'Full Control', allows: 'Everything Modify allows, plus changing permissions and taking ownership.', abuse: 'Can lock other people out, silently grant itself/others further access, or take ownership to bypass existing restrictions entirely -- the highest-impact level.' },
  { level: 'Modify', allows: 'Read, write, execute, and delete, but cannot change permissions or ownership.', abuse: 'Can tamper with, encrypt (ransomware-style), or destroy data, and plant executable content -- but can\'t entrench itself by rewriting the ACL.' },
  { level: 'Read & Execute', allows: 'Read files/folders and run existing executables; no write.', abuse: 'Information disclosure, and can run whatever is already there -- but can\'t plant or modify files.' },
  { level: 'Write', allows: 'Create/modify content without necessarily being able to delete or execute.', abuse: 'Can tamper with or inject content; impact depends heavily on whether the target location also allows execution.' },
  { level: 'Read', allows: 'Read-only.', abuse: 'Information disclosure only -- the lowest-impact level, but still worth reviewing for sensitive data.' },
  { level: 'Special', allows: 'A non-standard combination that does not match one of the above.', abuse: 'Impact depends entirely on the specific rights granted -- worth reviewing individually rather than assuming either way.' }
];

function renderAbuseReferenceTable() {
  const table = document.createElement('table');
  table.className = 'abuseTable';
  table.innerHTML = '<thead><tr><th>Level</th><th>Allows</th><th>Abuse potential if misused</th></tr></thead>';
  const tbody = document.createElement('tbody');
  ABUSE_REFERENCE.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><b>${esc(row.level)}</b></td><td>${esc(row.allows)}</td><td>${esc(row.abuse)}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function renderSummaryView() {
  state.selected = null;
  const content = document.getElementById('content');
  content.innerHTML = '';

  if (DATA.scanComplete === false || (DATA.truncatedRowsDropped || 0) > 0) {
    const banner = document.createElement('div');
    banner.className = 'incompleteBanner';
    const parts = [];
    if (DATA.scanComplete === false) {
      parts.push("This scan appears to have been interrupted before finishing (killed, crashed, or the machine rebooted mid-run) -- some folders may be missing entirely, not just from this report but from the underlying data. Everything that WAS successfully captured is still shown below and throughout.");
    }
    if ((DATA.truncatedRowsDropped || 0) > 0) {
      parts.push(`${DATA.truncatedRowsDropped} source file(s) had their last line cut off mid-write (consistent with the same kind of interruption) -- that one incomplete row was dropped; nothing else in those files was affected.`);
    }
    banner.textContent = '\u26a0 ' + parts.join(' ');
    content.appendChild(banner);
  }

  const idBreakdown = computeIdentityBreakdown();
  const userHealth = computeUserHealth();
  const rights = computeRightsDistribution();
  const brokenCount = DATA.folders.filter(f => f.broken).length;
  const dormantCount = DATA.identities.filter(i => i.flagDisabled || i.flagDormant || i.flagLocked).length;
  const scanErrorCount = (DATA.scanErrors || []).length;
  const observations = computeObservations();

  // --- Top-line stat cards ---
  const grid = document.createElement('div');
  grid.className = 'summaryGrid';
  grid.appendChild(statCard(DATA.identities.length, 'Identities total', {}));
  grid.appendChild(statCard(ACCESS_MAP_MANIFEST.totalEdgeCount || 0, 'Access entries total', {}));
  grid.appendChild(statCard(userHealth.total, `Users (${userHealth.enabled} enabled, ${userHealth.disabled} disabled)`, {}));
  grid.appendChild(statCard(idBreakdown.Group || 0, 'Groups', {}));
  grid.appendChild(statCard(idBreakdown.Computer || 0, 'Computer / service accounts', {}));
  grid.appendChild(statCard(DATA.folders.length, 'Folders scanned', {}));
  grid.appendChild(statCard(brokenCount, 'Broken inheritance', { tone: brokenCount > 0 ? 'warn' : '', onClick: brokenCount > 0 ? filterToBrokenFolders : null }));
  grid.appendChild(statCard(dormantCount, 'Disabled / dormant identities', { tone: dormantCount > 0 ? 'warn' : '', onClick: dormantCount > 0 ? filterToDormantIdentities : null }));
  grid.appendChild(statCard(scanErrorCount, 'Objects that could not be scanned', { tone: scanErrorCount > 0 ? 'bad' : '', onClick: scanErrorCount > 0 ? showScanErrorsDetail : null }));
  content.appendChild(grid);

  // --- Identity breakdown ---
  const idSection = document.createElement('div');
  idSection.className = 'summarySection';
  idSection.innerHTML = '<h2>Identities identified</h2>';
  IDENTITY_TYPE_ORDER.forEach(type => {
    if (!idBreakdown[type]) return;
    const row = document.createElement('div');
    row.className = 'breakdownRow';
    row.innerHTML = `<span>${esc(type)}</span><span>${idBreakdown[type]}</span>`;
    idSection.appendChild(row);
  });
  if (userHealth.total > 0) {
    const sub = document.createElement('div');
    sub.style.marginTop = '8px';
    sub.style.fontSize = '11px';
    sub.style.color = 'var(--muted)';
    sub.textContent = `Of ${userHealth.total} user(s): ${userHealth.enabled} enabled, ${userHealth.disabled} disabled, ${userHealth.locked} locked out, ${userHealth.dormant} with no logon in ${DORMANT_DAYS}+ days.`;
    idSection.appendChild(sub);
  }
  content.appendChild(idSection);

  // --- Rights distribution ---
  const rightsSection = document.createElement('div');
  rightsSection.className = 'summarySection';
  rightsSection.innerHTML = '<h2>Access rights distribution</h2>';
  const segments = RIGHTS_LABELS.map((label, i) => ({ label, count: rights[i], color: EDGE_COLORS[i] }));
  rightsSection.appendChild(renderChartWithLegend(segments));
  content.appendChild(rightsSection);

  // --- Abuse-potential reference ---
  const abuseSection = document.createElement('div');
  abuseSection.className = 'summarySection';
  abuseSection.innerHTML = '<h2>What each access level actually allows (and how it could be misused)</h2>';
  abuseSection.appendChild(renderAbuseReferenceTable());
  content.appendChild(abuseSection);

  // --- Observations / framework mapping ---
  const obsSection = document.createElement('div');
  obsSection.className = 'summarySection';
  obsSection.innerHTML = '<h2>Observations worth a closer look</h2>';
  const banner = document.createElement('div');
  banner.className = 'disclaimerBanner';
  banner.textContent = 'These are heuristic, data-driven starting points for a conversation with your security/compliance team -- not a certified compliance assessment. The guidance text below is paraphrased from publicly available framework documentation (not quoted verbatim), and frameworks are periodically revised -- check the current, authoritative source (ACSC, GCSB/NCSC-NZ, NIST, CIS) before treating this as a compliance determination either way.';
  obsSection.appendChild(banner);
  if (observations.length === 0) {
    const none = document.createElement('div');
    none.style.fontSize = '13px';
    none.style.color = 'var(--muted)';
    none.textContent = 'No notable observations from the signals this tool currently checks for.';
    obsSection.appendChild(none);
  } else {
    observations.forEach(obs => {
      const card = document.createElement('div');
      card.className = 'obsCard';
      const t = document.createElement('div');
      t.className = 'obsTitle';
      t.textContent = obs.title;
      card.appendChild(t);
      const why = document.createElement('div');
      why.className = 'obsWhy';
      why.textContent = obs.why;
      card.appendChild(why);
      const fw = document.createElement('div');
      fw.className = 'obsFrameworks';
      obs.guidance.forEach(g => {
        const row = document.createElement('div');
        row.className = 'guidanceRow';
        const pill = document.createElement('span');
        pill.className = 'regionPill regionPill-' + g.region;
        pill.textContent = g.region;
        row.appendChild(pill);
        const textSpan = document.createElement('span');
        textSpan.innerHTML = `<b>${esc(g.source)}:</b> ${esc(g.text)}`;
        row.appendChild(textSpan);
        fw.appendChild(row);
      });
      card.appendChild(fw);
      if (obs.action) {
        const btn = document.createElement('button');
        btn.textContent = 'View these';
        btn.style.marginTop = '6px';
        btn.onclick = obs.action;
        card.appendChild(btn);
      }
      obsSection.appendChild(card);
    });
  }
  content.appendChild(obsSection);

  const hint = document.createElement('p');
  hint.style.color = 'var(--muted)';
  hint.style.fontSize = '12px';
  hint.textContent = 'Select an identity or folder on the left for its own detail view (Tree/Graph tabs), or use the quick filters above.';
  content.appendChild(hint);
}

function setFilterButtonUI(btnId, val) {
  const btn = document.getElementById(btnId);
  btn.classList.remove('state-show', 'state-hide');
  let tag = btn.querySelector('.filterStateLabel');
  if (val === 0) {
    if (tag) tag.remove();
    btn.title = '';
    return;
  }
  if (val === 1) { btn.classList.add('state-show'); btn.title = 'Showing only these -- click to switch to hiding them, click again to turn off'; }
  else { btn.classList.add('state-hide'); btn.title = 'Hiding these -- click to turn off'; }
  if (!tag) { tag = document.createElement('span'); tag.className = 'filterStateLabel'; btn.appendChild(tag); }
  tag.textContent = val === 1 ? 'ON' : 'HIDDEN';
}

// Explicit "show only" entry points -- used by the Summary dashboard's
// clickable stat cards/observations, which mean "take me straight to these",
// not "toggle". The header buttons cycle instead (see cycleBrokenFilter/
// cycleDormantFilter in init()); both act on the same underlying state, so
// either path keeps the button's own visual state in sync.
function filterToBrokenFolders() {
  state.filterBroken = 1;
  setFilterButtonUI('btnBroken', 1);
  document.getElementById('searchBox').value = '';
  state.search = '';
  setTab('folders');
}

function filterToDormantIdentities() {
  state.filterDormant = 1;
  setFilterButtonUI('btnDormant', 1);
  document.getElementById('searchBox').value = '';
  state.search = '';
  setTab('identities');
}

/* --------------------------- Resizable split panes ---------------------------- */

function initSplitter() {
  const splitter = document.getElementById('splitter');
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const MIN_SIDEBAR = 220, MIN_CONTENT = 320;

  let saved = null;
  try { saved = localStorage.getItem('accessMapSidebarWidth'); } catch (e) { /* ignore -- fall back to CSS default */ }
  if (saved) {
    const w = parseInt(saved, 10);
    if (!isNaN(w) && w >= MIN_SIDEBAR) sidebar.style.width = w + 'px';
  }

  let dragging = false;
  splitter.addEventListener('pointerdown', (e) => {
    dragging = true;
    splitter.classList.add('dragging');
    try { splitter.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  splitter.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    let w = e.clientX - rect.left;
    const maxW = Math.max(MIN_SIDEBAR, rect.width - MIN_CONTENT - 6);
    w = Math.max(MIN_SIDEBAR, Math.min(maxW, w));
    sidebar.style.width = w + 'px';
  });
  function stopDrag() {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    try { localStorage.setItem('accessMapSidebarWidth', String(sidebar.getBoundingClientRect().width)); } catch (e) { /* ignore -- resize just won't persist across reloads */ }
  }
  splitter.addEventListener('pointerup', stopDrag);
  splitter.addEventListener('pointercancel', stopDrag);
  splitter.addEventListener('lostpointercapture', stopDrag);
}

/* ----------------------------------- Init ------------------------------------ */

function init() {
  precompute();
  renderSummaryView();
  renderList();
  initSplitter();

  document.getElementById('tabIdentities').onclick = () => setTab('identities');
  document.getElementById('tabFolders').onclick = () => setTab('folders');
  document.getElementById('searchBox').oninput = (e) => { state.search = e.target.value; renderList(); };
  document.getElementById('sortDirBtn').onclick = () => {
    state.sortDir *= -1;
    document.getElementById('sortDirBtn').innerHTML = state.sortDir === 1 ? 'A&ndash;Z' : 'Z&ndash;A';
    renderList();
    if (state.selected) {
      if (state.selected.kind === 'folder') renderFolder(state.selected.idx);
      else renderIdentity(state.selected.idx);
    }
  };
  document.getElementById('backBtn').onclick = goBack;
  document.getElementById('summaryBtn').onclick = renderSummaryView;

  // Header quick-filter buttons are 3-way toggles -- off / show-only (green,
  // "ON") / hide (red, "HIDDEN") -- rather than one-shot actions, so they can
  // be turned back off again without having to switch tabs or search to undo
  // them. Turning one on jumps to the tab it applies to; cycling within that
  // tab, or turning it off, just re-renders in place.
  document.getElementById('btnBroken').onclick = () => {
    state.filterBroken = (state.filterBroken + 1) % 3;
    setFilterButtonUI('btnBroken', state.filterBroken);
    if (state.filterBroken !== 0 && state.tab !== 'folders') setTab('folders'); else renderList();
  };
  document.getElementById('btnDormant').onclick = () => {
    state.filterDormant = (state.filterDormant + 1) % 3;
    setFilterButtonUI('btnDormant', state.filterDormant);
    if (state.filterDormant !== 0 && state.tab !== 'identities') setTab('identities'); else renderList();
  };

  if (DATA.scanComplete === false || (DATA.truncatedRowsDropped || 0) > 0) {
    const badge = document.getElementById('headerIncompleteBadge');
    badge.style.display = 'inline-block';
    badge.style.cursor = 'pointer';
    badge.onclick = renderSummaryView;
  }

  document.getElementById('footerLine').textContent =
    `Generated ${DATA.generatedAt} from ${DATA.sourceFolder} (toolkit v${DATA.toolkitVersion || '?'}) \u2014 point-in-time snapshot, not live data.`;
}

init();
